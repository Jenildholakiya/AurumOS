<!DOCTYPE html>
<html lang="en">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AurumOS | Select Year</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --offwhite:#f8fafb;--light:#f1f5f9;--lighter:#f1f5f9;
  --ink:#0f172a;--ink2:#1e293b;--ink3:#475569;
  --blue:#2563eb;--blue2:#3b82f6;--blue3:#1d4ed8;
  --blue-bg:rgba(37,99,235,.06);--blue-ln:rgba(37,99,235,.18);
  --rule:#e2e8f0;
  --gr:#16a34a;--grb:rgba(22,163,74,.08);--grl:rgba(22,163,74,.22);
  --muted:#64748b;--muted2:#94a3b8;
  --mono:Arial,sans-serif;
  --sans:"DM Sans",system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans);}
html,body{height:100%;background:var(--offwhite);color:var(--ink);overflow:hidden;}

body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 30% 0%,rgba(37,99,235,.06) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 100%,rgba(37,99,235,.04) 0%,transparent 50%);
}

.page{width:100%;max-width:480px;padding:20px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:24px;max-height:100vh;overflow-y:auto;scrollbar-width:none;}
.page::-webkit-scrollbar{display:none;}

/* ── Logo ── */
.logo{display:flex;flex-direction:column;align-items:center;gap:10px;animation:fadeUp .5s cubic-bezier(.34,1.56,.64,1) both;}
.logo-mark{
  width:56px;height:56px;border-radius:16px;
  background:var(--blue);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(37,99,235,0.3);
  position:relative;
}
.logo-mark::after{
  content:"";position:absolute;inset:-4px;border-radius:18px;
  border:2px solid rgba(37,99,235,.15);
}
.logo-mark span{font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:-0.5px;}
.logo-text{text-align:center;}
.logo-name{font-size:1.5rem;font-weight:700;color:var(--ink);letter-spacing:-.4px;}
.logo-name em{color:var(--blue);font-style:normal;}
.logo-sub{font-size:.6rem;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}

/* ── Heading ── */
.heading{text-align:center;animation:fadeUp .5s .06s cubic-bezier(.34,1.56,.64,1) both;}
.heading h1{font-size:1.35rem;font-weight:700;color:var(--ink);margin-bottom:4px;}
.heading p{font-size:.78rem;color:var(--muted);line-height:1.5;}

/* ── Current Year Hero ── */
.hero{
  width:100%;border-radius:16px;padding:28px 24px;
  background:linear-gradient(135deg,var(--ink) 0%,#1a2332 100%);
  cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(15,23,42,0.15);
  animation:fadeUp .5s .1s cubic-bezier(.34,1.56,.64,1) both;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 80% 20%,rgba(37,99,235,.2) 0%,transparent 50%),
    radial-gradient(circle at 20% 80%,rgba(59,130,246,.1) 0%,transparent 50%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.hero::after{
  content:"";position:absolute;top:-50%;right:-20%;width:200px;height:200px;
  border-radius:50%;border:1px solid rgba(255,255,255,.06);
  pointer-events:none;
}
.hero:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(37,99,235,0.3);
}
.hero:hover::before{opacity:1;}
.hero-left{position:relative;z-index:1;}
.hero-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.52rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--blue2);margin-bottom:10px;
}
.hero-badge::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--gr);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.hero-year{font-family:var(--mono);font-size:2rem;font-weight:800;color:#fff;margin-bottom:4px;line-height:1;}
.hero-sub{font-size:.72rem;color:rgba(255,255,255,.45);}
.hero-right{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.hero-live{
  font-size:.56rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  background:rgba(37,99,235,.2);color:var(--blue2);
  padding:5px 12px;border-radius:20px;border:1px solid rgba(37,99,235,.3);
}
.hero-arrow{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.5);font-size:1rem;
  transition:all .3s;
}
.hero:hover .hero-arrow{
  background:var(--blue);border-color:var(--blue);color:#fff;
  transform:translateX(4px);
}

/* ── Divider ── */
.divider{width:100%;display:flex;align-items:center;gap:12px;animation:fadeUp .5s .15s cubic-bezier(.34,1.56,.64,1) both;}
.divider-line{flex:1;height:1px;background:var(--rule);}
.divider-text{font-size:.52rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);white-space:nowrap;}

/* ── Archive Cards ── */
.arch-list{width:100%;display:flex;flex-direction:column;gap:8px;animation:fadeUp .5s .2s cubic-bezier(.34,1.56,.64,1) both;}

.arch-card{
  background:#fff;border:1px solid var(--rule);border-radius:14px;
  padding:16px 18px;cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
.arch-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--blue);border-radius:0 3px 3px 0;
  transform:scaleY(0);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.arch-card:hover{
  border-color:var(--blue-ln);
  background:var(--blue-bg);
  transform:translateX(4px);
  box-shadow:0 4px 16px rgba(37,99,235,0.08);
}
.arch-card:hover::before{transform:scaleY(1);}
.arch-icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--light);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .3s;
}
.arch-icon svg{width:18px;height:18px;color:var(--muted2);transition:color .3s;}
.arch-card:hover .arch-icon{background:var(--blue-bg);border-color:var(--blue-ln);}
.arch-card:hover .arch-icon svg{color:var(--blue);}
.arch-info{flex:1;min-width:0;}
.arch-year{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--ink2);transition:color .2s;}
.arch-card:hover .arch-year{color:var(--blue);}
.arch-meta{font-size:.65rem;color:var(--muted);margin-top:2px;}
.arch-pill{
  font-size:.52rem;font-weight:700;letter-spacing:0.5px;
  padding:4px 10px;border-radius:20px;
  background:var(--light);color:var(--muted);
  border:1px solid var(--rule);transition:all .3s;flex-shrink:0;
}
.arch-card:hover .arch-pill{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-ln);}
.arch-arrow{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted2);font-size:.85rem;
  transition:all .3s;flex-shrink:0;
}
.arch-card:hover .arch-arrow{color:var(--blue);transform:translateX(3px);}

.no-arch{
  background:#fff;border:1.5px dashed var(--rule);border-radius:14px;
  padding:28px;text-align:center;color:var(--muted);font-size:.76rem;line-height:1.8;
}

/* ── Loading ── */
.loading-overlay{
  position:fixed;inset:0;background:rgba(248,250,251,.95);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:999;
}
.loading-overlay.open{display:flex;}
.lo-spin{
  width:40px;height:40px;border:3px solid var(--rule);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.lo-year{font-family:var(--mono);font-size:1.1rem;font-weight:800;color:var(--ink2);margin-top:4px;}
.lo-text{font-size:.76rem;color:var(--muted);}

/* ── Error ── */
.err-box{
  background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);border-radius:10px;
  padding:10px 14px;font-size:.74rem;color:#dc2626;
  display:none;width:100%;
}
.err-box.show{display:block;}

/* ── Animations ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

.spin{
  display:inline-block;width:18px;height:18px;
  border:2px solid rgba(255,255,255,.2);border-top-color:var(--blue2);
  border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;
}
</style>
</head>
<body>

<div class="page">
  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark"><span>Au</span></div>
    <div class="logo-text">
      <div class="logo-name">Aurum<em>OS</em></div>
      <div class="logo-sub">Jewelry ERP</div>
    </div>
  </div>

  <!-- Heading -->
  <div class="heading">
    <h1>Select Financial Year</h1>
    <p>Open a year to continue. Current year has live data.</p>
  </div>

  <!-- Current Year Hero -->
  <div class="hero" id="current-card" onclick="selectYear('current')">
    <div class="hero-left">
      <div class="hero-badge">Active Year</div>
      <div class="hero-year" id="current-year-lbl"><span class="spin"></span></div>
      <div class="hero-sub" id="current-year-sub">Loading...</div>
    </div>
    <div class="hero-right">
      <span class="hero-live">LIVE</span>
      <div class="hero-arrow">&#8594;</div>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-text">Previous Years</div>
    <div class="divider-line"></div>
  </div>

  <!-- Archive List -->
  <div class="arch-list" id="arch-grid">
    <div class="no-arch">Loading...</div>
  </div>

  <div class="err-box" id="err-box"></div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="lo-spin"></div>
  <div class="lo-year" id="lo-year"></div>
  <div class="lo-text">Switching year...</div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
    waitForApi(function() {
        loadCurrentYear();
        loadArchivedYears();
    });
});

function waitForApi(cb) {
    if (window.pywebview && window.pywebview.api) { cb(); return; }
    setTimeout(function() { waitForApi(cb); }, 100);
}

function loadCurrentYear() {
    window.pywebview.api.get_active_year().then(function(r) {
        var lbl = document.getElementById('current-year-lbl');
        var sub = document.getElementById('current-year-sub');
        if (r && r.status === 'success' && r.year) {
            if (lbl) lbl.innerText = r.year;
            if (sub) sub.innerText = 'Live data \u2014 all changes save here';
        } else {
            window.pywebview.api.get_year_list().then(function(yr) {
                if (lbl) lbl.innerText = (yr && yr.current_year) ? yr.current_year : 'Current Year';
                if (sub) sub.innerText = 'Live data \u2014 all changes save here';
            }).catch(function() {
                if (lbl) lbl.innerText = 'Current Year';
                if (sub) sub.innerText = 'Live data';
            });
        }
    }).catch(function() {
        var lbl = document.getElementById('current-year-lbl');
        var sub = document.getElementById('current-year-sub');
        if (lbl) lbl.innerText = 'Current Year';
        if (sub) sub.innerText = 'Live data';
    });
}

function loadArchivedYears() {
    window.pywebview.api.get_year_list().then(function(r) {
        var grid = document.getElementById('arch-grid');
        if (!grid) return;

        var lbl = document.getElementById('current-year-lbl');
        if (lbl && (!lbl.innerText || lbl.querySelector('.spin')) && r && r.current_year) {
            lbl.innerText = r.current_year;
        }

        if (!r || r.status !== 'success') {
            grid.innerHTML = '<div class="no-arch">Error: ' + (r && r.message ? r.message : 'Could not load years') + '</div>';
            return;
        }

        if (!r.archived || !r.archived.length) {
            grid.innerHTML = '<div class="no-arch">No previous years archived yet.<br>Use Year-End Close to archive the current year.</div>';
            return;
        }

        grid.innerHTML = '';
        for (var i = 0; i < r.archived.length; i++) {
            (function(a) {
                var card = document.createElement('div');
                card.className = 'arch-card';
                card.innerHTML =
                    '<div class="arch-icon">'
                    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
                    + '<path d="M21 8v13H3V8"/><rect x="1" y="3" width="22" height="5" rx="1"/>'
                    + '<line x1="10" y1="12" x2="14" y2="12"/></svg>'
                    + '</div>'
                    + '<div class="arch-info">'
                    + '<div class="arch-year">' + a.year + '</div>'
                    + '<div class="arch-meta">' + a.size_mb + ' MB \u00b7 Read-only</div>'
                    + '</div>'
                    + '<span class="arch-pill">ARCHIVED</span>'
                    + '<div class="arch-arrow">&#8594;</div>';
                card.onclick = function() { selectYear(a.year); };
                grid.appendChild(card);
            })(r.archived[i]);
        }
    }).catch(function(e) {
        var grid = document.getElementById('arch-grid');
        if (grid) grid.innerHTML = '<div class="no-arch">Error loading years: ' + String(e) + '</div>';
    });
}

function selectYear(year) {
    var overlay = document.getElementById('loading-overlay');
    var loYear  = document.getElementById('lo-year');
    var errBox  = document.getElementById('err-box');

    if (errBox) errBox.className = 'err-box';
    if (overlay) overlay.className = 'loading-overlay open';
    if (loYear) loYear.innerText = year === 'current' ? 'Current Year' : year;

    window.pywebview.api.switch_year(year).then(function(r) {
        if (!r || r.status !== 'success') {
            if (overlay) overlay.className = 'loading-overlay';
            showErr(r && r.message ? r.message : 'Failed to switch year');
            return;
        }
        window.pywebview.api.navigate(r.landing || 'dashboard.html');
    }).catch(function(e) {
        if (overlay) overlay.className = 'loading-overlay';
        showErr(String(e));
    });
}

function showErr(msg) {
    var box = document.getElementById('err-box');
    if (box) { box.innerText = 'Error: ' + msg; box.className = 'err-box show'; }
}
</script>
</body>
</html>
