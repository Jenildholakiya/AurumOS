<!DOCTYPE html>
<html lang="en">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumOS | Bin Viewer</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
    --primary:#0f172a;--accent:#2563eb;--accent2:#3b82f6;--accent3:#1d4ed8;
    --accent-light:rgba(37,99,235,0.06);--accent-glow:rgba(37,99,235,0.08);
    --bg-main:#f8fafb;--card:#ffffff;--border:#e2e8f0;--light:#f1f5f9;--white:#ffffff;
    --text-main:#0f172a;--text-muted:#64748b;--text-muted2:#94a3b8;
    --success:#16a34a;--warning:#b45309;--error:#dc2626;
    --shadow-lux:0 1px 3px rgba(15,23,42,0.04),0 4px 16px rgba(15,23,42,0.06);
    --shadow-hover:0 8px 28px rgba(37,99,235,0.12),0 2px 8px rgba(15,23,42,0.04);
    --blue-ln:rgba(37,99,235,0.18);--green-ln:rgba(22,163,74,0.18);
    --ink:#0f172a;--ink2:#1e293b;--ink3:#475569;
    --serif:'DM Serif Display',Georgia,serif;
    --sans:'DM Sans',system-ui,sans-serif;
    --mono:Arial,sans-serif;
    --rule:#e2e8f0;--rule2:rgba(15,23,42,0.05);
    --cream2:#f1f5f9;--cream3:#e2e8f0;
    --blue-bg:rgba(37,99,235,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--sans);font-variant-numeric:tabular-nums;}
body{display:flex;height:100vh;background:var(--bg-main);color:var(--text-main);overflow:hidden;}
main{width:100%!important;min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden;}

header{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0;position:relative;z-index:100;}
.header-left{display:flex;align-items:center;gap:16px;}
.header-left h1{font-family:var(--sans);font-size:1rem;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;}
.header-left h1::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
.btn-back{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--white);font-size:0.72rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.2s;font-family:var(--sans);text-decoration:none;}
.btn-back:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(37,99,235,0.2);}
.breadcrumb{font-size:0.68rem;color:var(--text-muted);font-family:var(--mono);font-weight:500;}
.breadcrumb span{color:var(--accent);}

.scroll-area{flex:1;overflow-y:auto;padding:20px 28px 28px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin;scrollbar-color:var(--cream3) transparent;}
.scroll-area::-webkit-scrollbar{width:5px;}
.scroll-area::-webkit-scrollbar-track{background:transparent;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--cream3);border-radius:10px;}

/* ── STAT CARDS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow-lux);position:relative;overflow:hidden;transition:box-shadow 0.3s;}
.stat-card:hover{box-shadow:var(--shadow-hover);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card.blue::before{background:var(--accent);}
.stat-card.green::before{background:var(--success);}
.stat-card.slate::before{background:var(--ink3);}
.stat-card.red::before{background:var(--error);}
.stat-label{font-size:0.58rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted2);margin-bottom:8px;font-weight:600;}
.stat-value{font-family:var(--mono);font-size:1.4rem;color:var(--primary);letter-spacing:-0.5px;font-weight:700;}
.stat-sub{font-size:0.62rem;color:var(--text-muted);margin-top:4px;}

/* ── SEARCH ── */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:0 14px;height:42px;box-shadow:var(--shadow-lux);transition:all 0.2s;}
.search-bar:focus-within{border-color:var(--accent);box-shadow:var(--shadow-hover);}
.search-bar svg{flex-shrink:0;color:var(--text-muted2);}
.search-bar input{flex:1;height:100%;border:none;background:transparent;font-family:var(--mono);font-size:0.8rem;color:var(--ink);outline:none;}
.search-bar input::placeholder{color:var(--text-muted2);}
.search-count{font-size:0.65rem;color:var(--text-muted);font-family:var(--mono);white-space:nowrap;padding-left:10px;border-left:1px solid var(--rule);}

/* ── TABLE ── */
.data-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lux);}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);}
.table-title{font-size:0.82rem;color:var(--primary);font-weight:700;}
.table-badge{font-size:0.62rem;background:var(--blue-bg);color:var(--accent);border:1px solid var(--blue-ln);padding:4px 12px;border-radius:8px;font-family:var(--mono);font-weight:600;}
table{width:100%;border-collapse:collapse;}
th{background:var(--cream2);padding:11px 16px;text-align:left;font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted2);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 16px;font-size:0.78rem;color:var(--ink);border-bottom:1px solid var(--rule2);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--accent-light);}
.tag-id{font-family:var(--mono);font-size:0.72rem;font-weight:700;color:var(--accent);background:var(--blue-bg);padding:4px 10px;border-radius:6px;border:1px solid var(--blue-ln);}
.wt-green{font-family:var(--mono);color:var(--success);font-weight:600;}
.wt-muted{font-family:var(--mono);color:var(--text-muted);}
.status-tag{font-size:0.62rem;padding:4px 10px;border-radius:6px;font-weight:700;letter-spacing:0.3px;}
.status-tagged{background:rgba(22,163,74,0.08);color:#16a34a;border:1px solid rgba(22,163,74,0.2);}
.status-pending{background:rgba(220,38,38,0.06);color:#dc2626;border:1px solid rgba(220,38,38,0.15);}

/* ── EMPTY / LOADING STATES ── */
.empty-state{text-align:center;padding:56px 20px;color:var(--text-muted);}
.empty-icon{font-size:2.5rem;margin-bottom:14px;opacity:0.3;}
.empty-title{font-size:0.85rem;color:var(--text-main);margin-bottom:4px;font-weight:700;}
.empty-desc{font-size:0.72rem;color:var(--text-muted2);}
.loading-skeleton{display:flex;flex-direction:column;gap:8px;padding:16px;}
.skeleton-row{height:14px;background:linear-gradient(90deg,var(--cream2) 25%,var(--cream3) 50%,var(--cream2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;}
.skeleton-row:nth-child(1){width:60%;}
.skeleton-row:nth-child(2){width:80%;}
.skeleton-row:nth-child(3){width:45%;}
.skeleton-row:nth-child(4){width:70%;}
.skeleton-row:nth-child(5){width:55%;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.error-state{text-align:center;padding:32px;color:var(--error);font-size:0.8rem;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
    .stats-row{grid-template-columns:repeat(2,1fr);}
    header{padding:0 16px;}
    .scroll-area{padding:12px 16px 24px;}
    th,td{padding:8px 10px;font-size:0.72rem;}
}
</style>
</head>
<body>
<main>

<header>
    <div class="header-left">
        <a href="inventory.html" class="btn-back">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
            Inventory
        </a>
        <div style="width:1px;height:28px;background:var(--border);"></div>
        <h1>Bin Viewer</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
        <div class="breadcrumb">Inventory <span>/</span> Bin <span id="bin-breadcrumb">--</span></div>
    </div>
</header>

<div class="scroll-area">
    <!-- Stats Cards -->
    <div class="stats-row">
        <div class="stat-card blue">
            <div class="stat-label">Bin</div>
            <div class="stat-value" id="stat-bin">--</div>
            <div class="stat-sub">Storage cell</div>
        </div>
        <div class="stat-card green">
            <div class="stat-label">Total Weight</div>
            <div class="stat-value" id="stat-wt">0.000 <span style="font-size:0.7rem;color:var(--text-muted);">g</span></div>
            <div class="stat-sub">Net weight</div>
        </div>
        <div class="stat-card slate">
            <div class="stat-label">Total Items</div>
            <div class="stat-value" id="stat-items">0</div>
            <div class="stat-sub">in this bin</div>
        </div>
        <div class="stat-card red">
            <div class="stat-label">Tagged</div>
            <div class="stat-value" id="stat-tagged">0</div>
            <div class="stat-sub">pieces</div>
        </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="bin-search" placeholder="Search by name, code, or tag..." oninput="filterTable()" autocomplete="off">
        <span class="search-count" id="search-count"></span>
    </div>

    <!-- Table -->
    <div class="data-card">
        <div class="table-head">
            <span class="table-title">Bin Items</span>
            <span class="table-badge" id="item-badge">0 items</span>
        </div>
        <table>
            <thead><tr><th>SKU Tag</th><th>Description</th><th>Touch</th><th>Gross Wt</th><th>Net Wt</th><th>Status</th></tr></thead>
            <tbody id="bin-items-body">
                <tr><td colspan="6">
                    <div class="loading-skeleton">
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                    </div>
                </td></tr>
            </tbody>
        </table>
    </div>
</div>

</main>

<script>
'use strict';
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getBinId(){
    var params=new URLSearchParams(window.location.search);
    return params.get('bin')||'';
}

var allItems=[];

function loadBinItems(){
    var binId=getBinId();
    if(!binId){
        document.getElementById('bin-breadcrumb').innerText='Unknown';
        document.getElementById('stat-bin').innerText='--';
        document.getElementById('bin-items-body').innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">&#9888;&#65039;</div><div class="empty-title">No Bin Selected</div><div class="empty-desc">Go back to Inventory and click on a bin to view its items.</div></div></td></tr>';
        document.getElementById('item-badge').innerText='0 items';
        return;
    }
    document.getElementById('bin-breadcrumb').innerText=binId;
    document.getElementById('stat-bin').innerText=binId;
    if(!window.pywebview||!window.pywebview.api){
        document.getElementById('bin-items-body').innerHTML='<tr><td colspan="6"><div class="error-state">Bridge not ready. Please reload the page.</div></td></tr>';
        return;
    }
    window.pywebview.api.get_items_by_bin(binId).then(function(items){
        allItems=items||[];
        renderTable(allItems);
        var totalW=0, tagged=0;
        allItems.forEach(function(it){
            totalW+=parseFloat(it.nt_wt||0);
            if(it.live_status==='TAGGED') tagged+=(parseInt(it.pcs)||1);
        });
        document.getElementById('stat-wt').innerHTML=totalW.toFixed(3)+' <span style="font-size:0.7rem;color:var(--text-muted);">g</span>';
        document.getElementById('stat-items').innerText=allItems.length;
        document.getElementById('stat-tagged').innerText=tagged;
        document.getElementById('item-badge').innerText=allItems.length+' item'+(allItems.length!==1?'s':'');
    }).catch(function(){
        document.getElementById('bin-items-body').innerHTML='<tr><td colspan="6"><div class="error-state">&#10007; Failed to load items. Please try again.</div></td></tr>';
    });
}

function renderTable(items){
    var tbody=document.getElementById('bin-items-body');
    if(!items.length){
        var q=document.getElementById('bin-search').value.toLowerCase().trim();
        var msg=q?'No items match your search':'No items in this bin';
        var icon=q?'&#128269;':'&#128196;';
        tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">'+icon+'</div><div class="empty-title">'+msg+'</div><div class="empty-desc">'+(!q?'Try adding items to this bin from the Katti Terminal':'Try a different search term')+'</div></div></td></tr>';
        document.getElementById('search-count').innerText='';
        return;
    }
    tbody.innerHTML=items.map(function(it){
        var sc=it.live_status==='TAGGED'?'status-tagged':'status-pending';
        var st=it.live_status==='TAGGED'?'TAGGED':'PENDING';
        return '<tr>'
            +'<td><span class="tag-id">'+(it.it_code||'---')+'</span></td>'
            +'<td>'+(it.it_name||'---')+'</td>'
            +'<td>'+(it.touch||'--')+'%</td>'
            +'<td>'+parseFloat(it.gr_wt||0).toFixed(3)+'g</td>'
            +'<td class="wt-green">'+parseFloat(it.nt_wt||0).toFixed(3)+'g</td>'
            +'<td><span class="status-tag '+sc+'">'+st+'</span></td>'
            +'</tr>';
    }).join('');
}

function filterTable(){
    var q=document.getElementById('bin-search').value.toLowerCase().trim();
    var filtered=q ? allItems.filter(function(it){
        return (it.it_name||'').toLowerCase().indexOf(q)>=0
            ||(it.it_code||'').toLowerCase().indexOf(q)>=0
            ||(it.tag_id||'').toLowerCase().indexOf(q)>=0
            ||(it.huid||'').toLowerCase().indexOf(q)>=0;
    }) : allItems;
    renderTable(filtered);
    var countEl=document.getElementById('search-count');
    if(q){
        countEl.innerText=filtered.length+' of '+allItems.length;
    }else{
        countEl.innerText='';
    }
}

window.apiReady(function(){ loadBinItems(); });
</script>
</body>
</html>
