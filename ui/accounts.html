<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumOS | Accounts Terminal</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="sidebar.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
:root{
    --cream:#faf8f3;--cream2:#f2efe7;--cream3:#e8e3d8;
    --white:#fff;--ink:#0e0c09;--ink2:#2a2620;--ink3:#5c5a52;
    --gold:#a87d1e;--gold2:#c9a227;--gold3:#8a6c0a;
    --gold-bg:rgba(168,125,30,0.07);--gold-ln:rgba(168,125,30,0.2);
    --rule:rgba(14,12,9,0.09);--rule2:rgba(14,12,9,0.05);
    --muted:#7a7268;--muted2:#9e9890;
    --green:#15803d;--green-bg:rgba(21,128,61,0.07);
    --red:#b91c1c;--red-bg:rgba(185,28,28,0.06);
    --serif:'DM Serif Display',Georgia,serif;
    --mono:'DM Mono',monospace;
    --sh:0 1px 3px rgba(14,12,9,0.07),0 1px 2px rgba(14,12,9,0.04);
    --sh2:0 4px 16px rgba(14,12,9,0.08);
}
body{font-family:'DM Sans',system-ui,sans-serif;display:block;height:100vh;width:100vw;background:var(--cream);color:var(--ink);overflow:hidden;}
main{width:100%;display:flex;flex-direction:column;overflow:hidden;}

header{height:58px;background:var(--white);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;position:relative;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,var(--gold-ln) 50%,transparent 95%);}
.header-biz h1{font-family:var(--serif);font-size:1rem;font-weight:400;color:var(--ink);letter-spacing:-0.2px;}
.header-biz h1 em{color:var(--gold3);font-style:italic;}
#real-time-clock{font-family:var(--mono);font-size:0.63rem;color:var(--muted2);background:var(--cream2);padding:5px 11px;border-radius:4px;border:1px solid var(--rule);}

.content{padding:18px 24px 24px;overflow-y:auto;flex-grow:1;scrollbar-width:thin;scrollbar-color:var(--cream3) transparent;}

/* Stats */
.stats-ribbon{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.stat-mini{background:var(--white);padding:14px 18px;border-radius:8px;border:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.stat-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));}
.stat-mini label{font-size:0.54rem;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:0.9px;}
.stat-mini span{font-family:var(--serif);font-size:1.25rem;font-weight:400;color:var(--ink);letter-spacing:-0.3px;}

/* Layout */
.accounts-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;}

/* Form card */
.form-card{background:var(--white);border-radius:10px;border:1px solid var(--rule);padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));}
.form-card h3{font-size:0.58rem;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;color:var(--ink3);display:flex;align-items:center;gap:7px;}
.form-card h3 span{background:var(--ink);color:#fff;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:0.54rem;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:4px;letter-spacing:0.7px;}
input{width:100%;height:36px;padding:0 11px;border:1px solid var(--rule);border-radius:6px;font-size:0.82rem;font-weight:500;outline:none;transition:all 0.14s;background:var(--cream);color:var(--ink);font-family:inherit;}
input:focus{border-color:var(--gold2);background:var(--white);box-shadow:0 0 0 3px rgba(201,162,39,0.1);}
input[readonly]{background:var(--cream2);color:var(--muted2);cursor:default;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-authorize{width:100%;height:40px;background:var(--ink);color:#fff;border:none;border-radius:7px;font-family:inherit;font-weight:600;font-size:0.78rem;cursor:pointer;transition:all 0.15s;margin-top:10px;}
.btn-authorize:hover{background:var(--ink2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(14,12,9,0.15);}
.btn-authorize:disabled{opacity:0.45;cursor:not-allowed;transform:none;}

/* Table */
.list-container{background:var(--white);border-radius:10px;border:1px solid var(--rule);overflow:hidden;box-shadow:var(--sh);}
table{width:100%;border-collapse:collapse;min-width:500px;}
th{text-align:left;background:var(--cream2);padding:9px 16px;font-size:0.54rem;font-weight:600;color:var(--muted2);text-transform:uppercase;border-bottom:1px solid var(--rule);letter-spacing:0.7px;}
td{padding:11px 16px;font-size:0.78rem;font-weight:500;border-bottom:1px solid var(--rule2);color:var(--ink);vertical-align:middle;}
tr.clickable-row{cursor:pointer;transition:background 0.13s;}
tr.clickable-row:hover td{background:rgba(168,125,30,0.025);}

.client-info{display:flex;align-items:center;gap:11px;}
.client-avatar{width:32px;height:32px;background:var(--ink);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold2);font-size:0.65rem;flex-shrink:0;}
.client-name{font-weight:600;font-size:0.78rem;}
.client-uid{font-size:0.58rem;color:var(--muted2);font-family:var(--mono);margin-top:1px;}

.limit-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:0.7rem;font-weight:600;border:1px solid transparent;font-family:var(--mono);}
.metal-pill{background:var(--gold-bg);color:var(--gold3);border-color:var(--gold-ln);}
.cash-pill{background:var(--green-bg);color:var(--green);border-color:rgba(21,128,61,0.2);}
.limit-exceeded{background:var(--red-bg)!important;color:var(--red)!important;border-color:rgba(185,28,28,0.2)!important;}

.action-btns{display:flex;gap:6px;justify-content:flex-end;}
.btn-action{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.13s;border:1px solid var(--rule);background:var(--cream);color:var(--muted2);}
.btn-edit:hover{background:var(--gold-bg);color:var(--gold3);border-color:var(--gold-ln);}
.btn-delete:hover{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,0.2);}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(14,12,9,0.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-content{background:var(--white);width:360px;padding:22px;border-radius:12px;box-shadow:var(--sh2);border:1px solid var(--rule);animation:mp 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes mp{from{transform:scale(0.96) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-family:var(--serif);font-size:1rem;color:var(--ink);}
.modal-head h3 em{color:var(--gold3);font-style:italic;}
.modal-close{width:26px;height:26px;border-radius:5px;border:1px solid var(--rule);background:var(--cream);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.85rem;transition:all 0.13s;}
.modal-close:hover{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,0.2);}
</style>
<style id="aurum-layout-fix">
body { display: flex !important; height: 100vh !important; overflow: hidden !important; width: 100vw !important; }
#sidebar-container { flex-shrink: 0 !important; width: 252px !important; }
body > main { flex: 1 !important; min-width: 0 !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; }
body.sidebar-collapsed #sidebar-container { width: 66px !important; }
</style>
</head>
<body>
<script src="sidebar.js"></script>
<div id="sidebar-container"></div>


<script>
(function(){
  var p=location.href.split('/').pop().split('?')[0]||'dashboard.html';
  document.querySelectorAll('.sbl').forEach(function(a){if(a.dataset.p===p)a.classList.add('act');});
  var t=setInterval(function(){
    if(window.pywebview&&window.pywebview.api){clearInterval(t);
      try{window.pywebview.api.get_current_version().then(function(v){var e=document.getElementById('sb-ver');if(e&&v)e.innerText='v'+v;}).catch(function(){});}catch(e){}
    }
  },300);
})();
</script>

<script>
(function(){
  var p=location.href.split('/').pop().split('?')[0]||'dashboard.html';
  document.querySelectorAll('.sbl').forEach(function(a){if(a.dataset.p===p)a.classList.add('act');});
  var t=setInterval(function(){
    if(window.pywebview&&window.pywebview.api){
      clearInterval(t);
      try{window.pywebview.api.get_current_version().then(function(v){var e=document.getElementById('sb-ver');if(e&&v)e.innerText='v'+v;}).catch(function(){});}catch(e){}
    }
  },300);
})();
</script>
<main>
<header>
    <div class="header-biz"><h1>Accounts <em>Terminal</em></h1></div>
    <div id="real-time-clock">-</div>
</header>
<div class="content">
    <div class="stats-ribbon">
        <div class="stat-mini"><label>Total Registered</label><span id="stat-total-clients">0 Clients</span></div>
        <div class="stat-mini"><label>Global Metal Debt</label><span id="stat-global-metal">0.000 g</span></div>
        <div class="stat-mini"><label>Global Cash Debt</label><span id="stat-global-cash">Rs. 0.00</span></div>
    </div>
    <div class="accounts-layout">
        <div class="form-card">
            <h3><span>+</span> New Registration</h3>
            <div class="form-group"><label>Client Full Name</label><input type="text" id="c-name" placeholder="e.g. Rajesh Bhai Zaveri" data-next="c-phone"></div>
            <div class="form-group"><label>Contact Number</label><input type="text" id="c-phone" placeholder="+91 00000 00000" data-next="c-metal"></div>
            <div class="grid-2">
                <div class="form-group"><label>Metal Limit (g)</label><input type="number" id="c-metal" placeholder="0.000" data-next="c-cash"></div>
                <div class="form-group"><label>Cash Limit</label><input type="number" id="c-cash" placeholder="0.00" data-next="authorize-btn"></div>
            </div>
            <button class="btn-authorize" id="authorize-btn" onclick="saveClient()">Authorize Account</button>
        </div>
        <div class="list-container">
            <table>
                <thead><tr>
                    <th>Client Identity</th><th>Contact</th>
                    <th>Metal Live</th><th>Cash Live</th>
                    <th style="text-align:right;">Action</th>
                </tr></thead>
                <tbody id="client-table-body">
                    <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted2);">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<script>
var globalClientList = [];
function getInitials(n){ return n?n.split(' ').map(function(x){return x[0];}).join('').toUpperCase().substring(0,2):'??'; }

async function loadClients(){
    if(!window.pywebview?.api) return;
    var clients = await window.pywebview.api.get_client_list();
    globalClientList = clients;
    var tbody = document.getElementById('client-table-body');
    tbody.innerHTML = '';
    var gMetal=0, gCash=0;
    if(!clients.length){ tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted2);">No clients yet.</td></tr>'; document.getElementById('stat-total-clients').innerText='0 Clients'; return; }
    clients.forEach(async function(c,i){
        var id = (i+1).toString().padStart(3,'0');
        var bal = await window.pywebview.api.get_client_balances(c.name);
        gMetal+=bal.metal; gCash+=bal.cash;
        var mEx = bal.metal>(parseFloat(c.metal_limit)||0) && (parseFloat(c.metal_limit)||0)>0;
        var cEx = bal.cash >(parseFloat(c.cash_limit) ||0) && (parseFloat(c.cash_limit) ||0)>0;
        var row = document.createElement('tr');
        row.className='clickable-row';
        row.ondblclick=function(){ window.location.href='client_ledger.html?name='+encodeURIComponent(c.name); };
        row.innerHTML=
            '<td><div class="client-info">'
            +'<div class="client-avatar">'+getInitials(c.name)+'</div>'
            +'<div><div class="client-name">'+c.name+'</div><div class="client-uid">CL-'+id+'</div></div>'
            +'</div></td>'
            +'<td style="font-family:var(--mono);font-size:0.72rem;color:var(--muted2);">'+(c.phone||'-')+'</td>'
            +'<td><span class="limit-pill metal-pill'+(mEx?' limit-exceeded':'')+'">'+parseFloat(bal.metal).toFixed(3)+' g</span></td>'
            +'<td><span class="limit-pill cash-pill'+(cEx?' limit-exceeded':'')+'">Rs. '+parseFloat(bal.cash).toLocaleString('en-IN')+'</span></td>'
            +'<td style="text-align:right;"><div class="action-btns">'
            +'<button class="btn-action btn-edit" onclick="event.stopPropagation();triggerEdit('+c.id+')" title="Edit">'
            +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
            +'</button>'
            +'<button class="btn-action btn-delete" onclick="event.stopPropagation();deleteClient('+c.id+')" title="Delete">x</button>'
            +'</div></td>';
        tbody.appendChild(row);
        document.getElementById('stat-global-metal').innerText=gMetal.toFixed(3)+' g';
        document.getElementById('stat-global-cash').innerText='Rs. '+gCash.toLocaleString('en-IN');
    });
    document.getElementById('stat-total-clients').innerText=clients.length+' Clients';
}

function triggerEdit(id){
    var c=globalClientList.find(function(x){return x.id===id;});
    if(!c) return;
    document.getElementById('edit-id').value=c.id;
    document.getElementById('edit-name').value=c.name;
    document.getElementById('edit-metal').value=c.metal_limit;
    document.getElementById('edit-cash').value=c.cash_limit;
    document.getElementById('edit-modal').style.display='flex';
}
function closeEditModal(){ document.getElementById('edit-modal').style.display='none'; }

async function updateLimits(){
    if(!window.pywebview?.api) return;
    var btn=document.querySelector('#edit-modal .btn-authorize');
    var orig=btn.innerText; btn.disabled=true; btn.innerText='Saving...';
    try{
        var res=await window.pywebview.api.update_client_limits({
            id:Number(document.getElementById('edit-id').value),
            metal_limit:parseFloat(document.getElementById('edit-metal').value)||0,
            cash_limit:parseFloat(document.getElementById('edit-cash').value)||0
        });
        if(res&&res.status==='success'){ closeEditModal(); setTimeout(loadClients,100); }
        else alert('Failed: '+(res?.message||'Unknown'));
    }catch(e){ alert('Error: '+e); }
    finally{ btn.disabled=false; btn.innerText=orig; }
}

async function saveClient(){
    var name=document.getElementById('c-name').value.trim();
    if(!name){ document.getElementById('c-name').focus(); return; }
    var res=await window.pywebview.api.add_new_client({
        name:name, phone:document.getElementById('c-phone').value,
        metal_limit:parseFloat(document.getElementById('c-metal').value)||0,
        cash_limit:parseFloat(document.getElementById('c-cash').value)||0
    });
    if(res.status==='success'){
        ['c-name','c-phone','c-metal','c-cash'].forEach(function(id){document.getElementById(id).value='';});
        loadClients();
    }
}

async function deleteClient(id){
    if(!confirm('Remove this client?')) return;
    var res=await window.pywebview.api.delete_master_entry('client',id);
    if(res.status==='success') loadClients();
}

document.addEventListener('keydown',function(e){
    if(e.key!=='Enter') return;
    var a=document.activeElement, nid=a.dataset.next;
    if(!nid) return; e.preventDefault();
    var n=document.getElementById(nid);
    if(n) n.tagName==='BUTTON'?n.click():n.focus();
});

window.onload=function(){
        waitForAPI(function(){ initSidebar('accounts'); initSidebar('accounts'); });
setInterval(function(){
        var n=new Date();
        document.getElementById('real-time-clock').innerText=n.toLocaleDateString('en-GB')+' | '+n.toLocaleTimeString();
    },1000);
    var t=setInterval(function(){if(window.pywebview?.api){loadClients();clearInterval(t);}},100);
};
</script>
</body>
</html>
