<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumOS | Accounts Terminal</title>
<link rel="stylesheet" href="fonts.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
:root{
  --cream:#faf8f3;--cream2:#f2efe7;--cream3:#e8e3d8;
  --white:#fff;--ink:#0e0c09;--ink2:#2a2620;--ink3:#5c5a52;
  --gold:#a87d1e;--gold2:#c9a227;--gold3:#8a6c0a;
  --gold-bg:rgba(168,125,30,0.07);--gold-ln:rgba(168,125,30,0.22);
  --rule:rgba(14,12,9,0.09);--rule2:rgba(14,12,9,0.05);
  --muted:#7a7268;--muted2:#9e9890;
  --green:#15803d;--green-bg:rgba(21,128,61,0.07);
  --red:#b91c1c;--red-bg:rgba(185,28,28,0.06);
  --serif:'DM Serif Display',Georgia,serif;
  --mono:'DM Mono',monospace;
  --sh:0 1px 3px rgba(14,12,9,0.07),0 1px 2px rgba(14,12,9,0.04);
  --sh2:0 4px 16px rgba(14,12,9,0.08);
}

/* ── LAYOUT ── */
html,body{height:100%;overflow:hidden;}
body{display:flex;flex-direction:row;width:100vw;height:100vh;background:var(--cream);font-family:'DM Sans',system-ui,sans-serif;}

/* ── SIDEBAR ── */
#sidebar{
  width:252px;flex-shrink:0;height:100%;
  background:var(--white);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  transition:width 0.25s ease;
  overflow:hidden;
  position:relative;z-index:10;
}
body.sidebar-collapsed #sidebar{width:66px;}

.sb-logo{
  display:flex;align-items:center;gap:10px;
  padding:18px 16px 14px;
  border-bottom:1px solid var(--rule);
  flex-shrink:0;overflow:hidden;
}
.sb-logo-mark{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;font-weight:400;color:var(--gold2);
  letter-spacing:-0.5px;
}
.sb-logo-name{font-family:var(--serif);font-size:15px;color:var(--ink);white-space:nowrap;}
.sb-logo-name em{color:var(--gold3);font-style:italic;}
.sb-logo-sub{font-size:9px;font-weight:600;letter-spacing:0.12em;color:var(--muted2);text-transform:uppercase;margin-top:1px;}

.sb-version{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid var(--rule);flex-shrink:0;
}
.sb-ver-label{font-size:9px;font-weight:600;letter-spacing:0.1em;color:var(--muted2);text-transform:uppercase;}
.sb-ver-pill{
  font-family:var(--mono);font-size:10px;color:var(--gold3);
  background:var(--gold-bg);border:1px solid var(--gold-ln);
  border-radius:100px;padding:2px 9px;
}

.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;scrollbar-width:none;}
.sb-nav::-webkit-scrollbar{display:none;}

.sb-section-label{
  font-size:9px;font-weight:600;letter-spacing:0.12em;
  color:var(--muted2);text-transform:uppercase;
  padding:10px 10px 5px;white-space:nowrap;overflow:hidden;
}
body.sidebar-collapsed .sb-section-label{opacity:0;}

.sb-divider{height:1px;background:var(--rule);margin:6px 0;}

.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  color:var(--muted);font-size:13px;font-weight:500;
  transition:background 0.13s,color 0.13s;
  white-space:nowrap;overflow:hidden;
  position:relative;
}
.sb-item:hover{background:var(--cream);color:var(--ink);}
.sb-item.active{
  background:var(--cream2);color:var(--ink);font-weight:600;
  border-left:2px solid var(--gold2);
}
.sb-icon{
  width:32px;height:32px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:inherit;transition:background 0.13s;
}
.sb-item.active .sb-icon{background:var(--gold-bg);color:var(--gold3);}
.sb-label{font-size:13px;transition:opacity 0.2s;}
body.sidebar-collapsed .sb-label{opacity:0;pointer-events:none;}

/* Tooltip for collapsed */
body.sidebar-collapsed .sb-item::after{
  content:attr(data-tip);
  position:absolute;left:calc(66px - 8px);top:50%;transform:translateY(-50%);
  background:var(--ink2);color:#fff;font-size:11px;font-weight:500;
  padding:5px 10px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity 0.15s;
  z-index:999;
}
body.sidebar-collapsed .sb-item:hover::after{opacity:1;}

/* Owner / Footer */
.sb-footer{padding:8px;border-top:1px solid var(--rule);flex-shrink:0;}

.sb-owner-wrap{position:relative;margin-bottom:6px;}
.sb-owner-row{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:all 0.13s;overflow:hidden;
}
.sb-owner-row:hover{background:var(--cream2);border-color:var(--rule);}
.sb-avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:var(--ink);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:0.05em;
}
.sb-owner-name{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-owner-role{font-size:10px;color:var(--muted2);margin-top:1px;}
.sb-owner-chev{flex-shrink:0;margin-left:auto;color:var(--muted2);transition:transform 0.2s;}
body.sidebar-collapsed .sb-owner-name,
body.sidebar-collapsed .sb-owner-role,
body.sidebar-collapsed .sb-owner-chev{opacity:0;}

.sb-logout-pop{
  display:none;position:absolute;bottom:calc(100% + 6px);left:0;right:0;
  background:var(--ink2);border-radius:10px;padding:6px;
  box-shadow:0 8px 24px rgba(14,12,9,0.25);z-index:200;
  border:1px solid rgba(201,162,39,0.15);
}
.sb-logout-pop.open{display:block;}
.sb-pop-info{padding:7px 10px 9px;border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:5px;}
.sb-pop-name{font-size:12px;font-weight:600;color:#fff;}
.sb-pop-role{font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px;}
.sb-logout-btn{
  width:100%;padding:8px 10px;background:transparent;border:none;border-radius:6px;
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:8px;color:rgba(255,100,100,0.85);text-align:left;
  transition:background 0.13s;
}
.sb-logout-btn:hover{background:rgba(185,28,28,0.15);}

.sb-collapse-btn{
  width:100%;padding:9px 10px;background:transparent;border:none;border-radius:7px;
  font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:background 0.13s,color 0.13s;
  overflow:hidden;
}
.sb-collapse-btn:hover{background:var(--cream2);color:var(--ink);}
.sb-collapse-icon{flex-shrink:0;transition:transform 0.25s;font-size:14px;}
body.sidebar-collapsed .sb-collapse-icon{transform:rotate(180deg);}
.sb-collapse-text{transition:opacity 0.2s;}
body.sidebar-collapsed .sb-collapse-text{opacity:0;}

/* ── MAIN ── */
main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

header{
  height:56px;background:var(--white);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0;position:relative;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,var(--gold-ln) 50%,transparent 95%);
}
.header-title{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink);}
.header-title em{color:var(--gold3);font-style:italic;}
#clock{
  font-family:var(--mono);font-size:11px;color:var(--muted2);
  background:var(--cream2);border:1px solid var(--rule);
  border-radius:5px;padding:5px 12px;
}

/* ── CONTENT ── */
.content{padding:20px 24px 24px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--cream3) transparent;}

/* Stats ribbon */
.stats-ribbon{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.stat-card{
  background:var(--white);border:1px solid var(--rule);
  border-radius:10px;padding:14px 18px;
  box-shadow:var(--sh);position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}
.stat-card label{
  display:block;font-size:9px;font-weight:600;letter-spacing:0.09em;
  text-transform:uppercase;color:var(--muted2);margin-bottom:5px;
}
.stat-card span{font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:-0.3px;}

/* Main grid */
.accounts-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}

/* Form card */
.form-card{
  background:var(--white);border:1px solid var(--rule);
  border-radius:10px;padding:20px;box-shadow:var(--sh);
  position:relative;overflow:hidden;
}
.form-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}
.form-card-title{
  display:flex;align-items:center;gap:8px;
  font-size:9px;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:16px;
}
.form-card-icon{
  width:20px;height:20px;border-radius:5px;
  background:var(--ink);color:var(--white);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.form-group{margin-bottom:11px;}
.form-group label{
  display:block;font-size:9px;font-weight:600;
  letter-spacing:0.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;
}
input{
  width:100%;height:36px;padding:0 11px;
  border:1px solid var(--rule);border-radius:7px;
  font-size:13px;font-weight:500;outline:none;
  background:var(--cream);color:var(--ink);font-family:inherit;
  transition:border-color 0.14s,box-shadow 0.14s,background 0.14s;
}
input:focus{border-color:var(--gold2);background:var(--white);box-shadow:0 0 0 3px rgba(201,162,39,0.1);}
input[readonly]{background:var(--cream2);color:var(--muted2);cursor:default;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn-primary{
  width:100%;height:40px;background:var(--ink);color:#fff;
  border:none;border-radius:8px;font-family:inherit;
  font-weight:600;font-size:13px;cursor:pointer;
  transition:background 0.15s,transform 0.13s,box-shadow 0.15s;
  margin-top:12px;
}
.btn-primary:hover{background:var(--ink2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(14,12,9,0.15);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* Client table */
.table-card{
  background:var(--white);border:1px solid var(--rule);
  border-radius:10px;overflow:hidden;box-shadow:var(--sh);
}
.table-header{
  padding:14px 18px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;
}
.table-title{font-size:11px;font-weight:600;color:var(--ink);letter-spacing:0.02em;}
.table-count{
  font-family:var(--mono);font-size:10px;color:var(--muted2);
  background:var(--cream2);border:1px solid var(--rule);
  border-radius:100px;padding:2px 9px;
}
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;background:var(--cream2);
  padding:9px 16px;font-size:9px;font-weight:600;
  color:var(--muted2);text-transform:uppercase;
  letter-spacing:0.08em;border-bottom:1px solid var(--rule);
}
td{
  padding:11px 16px;font-size:13px;font-weight:500;
  border-bottom:1px solid var(--rule2);color:var(--ink);
  vertical-align:middle;
}
tr:last-child td{border-bottom:none;}
tr.row{cursor:pointer;transition:background 0.12s;}
tr.row:hover td{background:rgba(168,125,30,0.025);}

.client-cell{display:flex;align-items:center;gap:11px;}
.c-avatar{
  width:32px;height:32px;border-radius:7px;flex-shrink:0;
  background:var(--ink);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:0.03em;
}
.c-name{font-weight:600;font-size:13px;}
.c-uid{font-size:10px;color:var(--muted2);font-family:var(--mono);margin-top:1px;}

.pill{
  display:inline-flex;align-items:center;
  padding:3px 9px;border-radius:5px;
  font-size:11px;font-weight:600;font-family:var(--mono);
  border:1px solid transparent;
}
.pill-gold{background:var(--gold-bg);color:var(--gold3);border-color:var(--gold-ln);}
.pill-green{background:var(--green-bg);color:var(--green);border-color:rgba(21,128,61,0.2);}
.pill-red{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,0.2);}

.action-btns{display:flex;gap:5px;justify-content:flex-end;}
.btn-icon{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.13s;
  border:1px solid var(--rule);background:var(--cream);color:var(--muted2);
}
.btn-icon:hover.edit{background:var(--gold-bg);color:var(--gold3);border-color:var(--gold-ln);}
.btn-icon:hover.del{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,0.2);}

.empty-state{
  text-align:center;padding:40px;
  font-size:13px;color:var(--muted2);
}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(14,12,9,0.45);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:500;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--white);width:340px;
  padding:22px;border-radius:12px;
  box-shadow:0 16px 48px rgba(14,12,9,0.2);
  border:1px solid var(--rule);
  animation:modal-in 0.28s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modal-in{
  from{transform:scale(0.94) translateY(10px);opacity:0;}
  to{transform:scale(1) translateY(0);opacity:1;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h3{font-family:var(--serif);font-size:16px;color:var(--ink);}
.modal-head h3 em{color:var(--gold3);font-style:italic;}
.btn-modal-close{
  width:26px;height:26px;border-radius:6px;
  border:1px solid var(--rule);background:var(--cream);
  color:var(--muted);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.13s;
}
.btn-modal-close:hover{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,0.2);}
</style>
</head>
<body>

<!-- ══════════════════════════════
     SIDEBAR  (no duplicate IDs)
══════════════════════════════ -->
<aside id="sidebar">
  <!-- Logo -->
  <div class="sb-logo">
    <div class="sb-logo-mark">Au</div>
    <div>
      <div class="sb-logo-name">Aurum<em>OS</em></div>
      <div class="sb-logo-sub">Jewelry ERP</div>
    </div>
  </div>

  <!-- Version -->
  <div class="sb-version">
    <span class="sb-ver-label">Version</span>
    <span class="sb-ver-pill" id="ver-pill">v1.0</span>
  </div>

  <!-- Nav -->
  <nav class="sb-nav" id="sb-nav">
    <!-- populated by JS based on role -->
  </nav>

  <!-- Owner / logout -->
  <div class="sb-footer">
    <div class="sb-owner-wrap">
      <div class="sb-logout-pop" id="logout-pop">
        <div class="sb-pop-info">
          <div class="sb-pop-name" id="pop-name">Director</div>
          <div class="sb-pop-role">System Owner</div>
        </div>
        <button class="sb-logout-btn" onclick="doLogout()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
      <div class="sb-owner-row" onclick="toggleLogout()">
        <div class="sb-avatar" id="owner-avatar">OS</div>
        <div>
          <div class="sb-owner-name" id="owner-name">Director</div>
          <div class="sb-owner-role">System Owner</div>
        </div>
        <svg id="owner-chev" class="sb-owner-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
      </div>
    </div>
    <button class="sb-collapse-btn" onclick="toggleSidebar()">
      <span class="sb-collapse-icon">←</span>
      <span class="sb-collapse-text">Collapse</span>
    </button>
  </div>
</aside>

<!-- ══════════════════════════════
     MAIN
══════════════════════════════ -->
<main>
  <header>
    <div class="header-title">Accounts <em>Terminal</em></div>
    <div id="clock">—</div>
  </header>

  <div class="content">

    <!-- Stats -->
    <div class="stats-ribbon">
      <div class="stat-card">
        <label>Total Registered</label>
        <span id="stat-clients">0 Clients</span>
      </div>
      <div class="stat-card">
        <label>Global Metal Debt</label>
        <span id="stat-metal">0.000 g</span>
      </div>
      <div class="stat-card">
        <label>Global Cash Debt</label>
        <span id="stat-cash">Rs. 0.00</span>
      </div>
    </div>

    <!-- Main grid -->
    <div class="accounts-grid">

      <!-- New Registration Form -->
      <div class="form-card">
        <div class="form-card-title">
          <div class="form-card-icon">+</div>
          New Registration
        </div>
        <div class="form-group">
          <label>Client Full Name</label>
          <input type="text" id="c-name" placeholder="e.g. Rajesh Bhai Zaveri" data-next="c-phone">
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" id="c-phone" placeholder="+91 00000 00000" data-next="c-metal">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Metal Limit (g)</label>
            <input type="number" id="c-metal" placeholder="0.000" data-next="c-cash">
          </div>
          <div class="form-group">
            <label>Cash Limit</label>
            <input type="number" id="c-cash" placeholder="0.00" data-next="btn-authorize">
          </div>
        </div>
        <button class="btn-primary" id="btn-authorize" onclick="saveClient()">Authorize Account</button>
      </div>

      <!-- Client Table -->
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">Registered Clients</span>
          <span class="table-count" id="client-count">0 clients</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Client Identity</th>
              <th>Contact</th>
              <th>Metal Live</th>
              <th>Cash Live</th>
              <th style="text-align:right;">Action</th>
            </tr>
          </thead>
          <tbody id="client-tbody">
            <tr><td colspan="5" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</main>

<!-- ══════════════════════════════
     EDIT MODAL
══════════════════════════════ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Edit <em>Limits</em></h3>
      <button class="btn-modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Client Name</label>
      <input type="text" id="edit-name" readonly>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Metal Limit (g)</label>
        <input type="number" id="edit-metal" placeholder="0.000">
      </div>
      <div class="form-group">
        <label>Cash Limit</label>
        <input type="number" id="edit-cash" placeholder="0.00">
      </div>
    </div>
    <button class="btn-primary" id="btn-update" onclick="updateLimits()">Save Changes</button>
  </div>
</div>

<script>
/* ── SIDEBAR NAV DEFINITIONS ── */
var NAV_ADMIN = [
  { section:'Main' },
  { label:'Dashboard',   icon:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',  href:'dashboard.html' },

  { section:'Main' },
  { label:'Create Bill', icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>',  href:'billing.html', active:true },
];

function buildNav(items){
  var nav = document.getElementById('sb-nav');
  nav.innerHTML = '';
  items.forEach(function(it){
    if(it.section){
      var d = document.createElement('div');
      d.className='sb-section-label'; d.textContent=it.section; nav.appendChild(d);
    } else if(it.divider){
      var d = document.createElement('div'); d.className='sb-divider'; nav.appendChild(d);
    } else {
      var d = document.createElement('div');
      d.className = 'sb-item' + (it.active?' active':'');
      d.setAttribute('data-tip', it.label);
      d.onclick = function(){ window.location.href = it.href; };
      d.innerHTML =
        '<div class="sb-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+it.icon+'</svg></div>'
        +'<span class="sb-label">'+it.label+'</span>';
      nav.appendChild(d);
    }
  });
}

/* ── SIDEBAR LOGIC ── */
function toggleSidebar(){
  document.body.classList.toggle('sidebar-collapsed');
  localStorage.setItem('sb_collapsed', document.body.classList.contains('sidebar-collapsed')?'1':'0');
}
function toggleLogout(){
  var pop = document.getElementById('logout-pop');
  var chev = document.getElementById('owner-chev');
  var open = pop.classList.toggle('open');
  chev.style.transform = open ? 'rotate(180deg)' : '';
}
function doLogout(){
  try{ if(window.pywebview&&window.pywebview.api) window.pywebview.api.logout(); }catch(e){}
  localStorage.removeItem('aurum_user_role');
  localStorage.removeItem('aurum_active_user');
  window.location.href = 'login.html';
}
document.addEventListener('click', function(e){
  var pop = document.getElementById('logout-pop');
  if(!pop.classList.contains('open')) return;
  if(!pop.contains(e.target) && !e.target.closest('.sb-owner-row')){
    pop.classList.remove('open');
    document.getElementById('owner-chev').style.transform = '';
  }
});

/* ── CLOCK ── */
function updateClock(){
  var n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('en-GB') + ' | ' + n.toLocaleTimeString();
}
setInterval(updateClock, 1000); updateClock();

/* ── DATA ── */
var clientList = [];
function initials(n){ return (n||'').split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().substring(0,2)||'??'; }

async function loadClients(){
  if(!window.pywebview?.api) return;
  var clients = await window.pywebview.api.get_client_list();
  clientList = clients;
  var tbody = document.getElementById('client-tbody');
  document.getElementById('client-count').textContent = clients.length + ' client' + (clients.length===1?'':'s');
  document.getElementById('stat-clients').textContent = clients.length + ' Client' + (clients.length===1?'':'s');
  tbody.innerHTML = '';
  if(!clients.length){
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No clients registered yet.</td></tr>';
    return;
  }
  var gMetal=0, gCash=0;
  for(var i=0;i<clients.length;i++){
    (function(c,idx){
      window.pywebview.api.get_client_balances(c.name).then(function(bal){
        gMetal += bal.metal; gCash += bal.cash;
        var mOver = bal.metal > (parseFloat(c.metal_limit)||0) && (parseFloat(c.metal_limit)||0)>0;
        var cOver = bal.cash  > (parseFloat(c.cash_limit) ||0) && (parseFloat(c.cash_limit) ||0)>0;
        var tr = document.createElement('tr');
        tr.className = 'row';
        tr.ondblclick = function(){ window.location.href='client_ledger.html?name='+encodeURIComponent(c.name); };
        tr.innerHTML =
          '<td><div class="client-cell">'
          +'<div class="c-avatar">'+initials(c.name)+'</div>'
          +'<div><div class="c-name">'+c.name+'</div>'
          +'<div class="c-uid">CL-'+String(idx+1).padStart(3,'0')+'</div></div>'
          +'</div></td>'
          +'<td style="font-family:var(--mono);font-size:11px;color:var(--muted2);">'+(c.phone||'—')+'</td>'
          +'<td><span class="pill '+(mOver?'pill-red':'pill-gold')+'">'+parseFloat(bal.metal).toFixed(3)+' g</span></td>'
          +'<td><span class="pill '+(cOver?'pill-red':'pill-green')+'">Rs. '+parseFloat(bal.cash).toLocaleString('en-IN')+'</span></td>'
          +'<td style="text-align:right;"><div class="action-btns">'
          +'<button class="btn-icon edit" title="Edit limits" onclick="event.stopPropagation();openEdit('+c.id+')">'
          +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg>'
          +'</button>'
          +'<button class="btn-icon del" title="Remove client" onclick="event.stopPropagation();removeClient('+c.id+')">'
          +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>'
          +'</button>'
          +'</div></td>';
        tbody.appendChild(tr);
        document.getElementById('stat-metal').textContent = gMetal.toFixed(3)+' g';
        document.getElementById('stat-cash').textContent  = 'Rs. '+gCash.toLocaleString('en-IN');
      });
    })(clients[i], i);
  }
}

function openEdit(id){
  var c = clientList.find(function(x){return x.id===id;});
  if(!c) return;
  document.getElementById('edit-id').value    = c.id;
  document.getElementById('edit-name').value  = c.name;
  document.getElementById('edit-metal').value = c.metal_limit;
  document.getElementById('edit-cash').value  = c.cash_limit;
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal(){ document.getElementById('edit-modal').classList.remove('open'); }

async function updateLimits(){
  if(!window.pywebview?.api) return;
  var btn = document.getElementById('btn-update');
  btn.disabled=true; btn.textContent='Saving…';
  try{
    var res = await window.pywebview.api.update_client_limits({
      id: Number(document.getElementById('edit-id').value),
      metal_limit: parseFloat(document.getElementById('edit-metal').value)||0,
      cash_limit:  parseFloat(document.getElementById('edit-cash').value)||0
    });
    if(res&&res.status==='success'){ closeModal(); loadClients(); }
    else alert('Failed: '+(res?.message||'Unknown error'));
  }catch(e){ alert('Error: '+e); }
  finally{ btn.disabled=false; btn.textContent='Save Changes'; }
}

async function saveClient(){
  var name = document.getElementById('c-name').value.trim();
  if(!name){ document.getElementById('c-name').focus(); return; }
  var btn = document.getElementById('btn-authorize');
  btn.disabled=true; btn.textContent='Saving…';
  try{
    var res = await window.pywebview.api.add_new_client({
      name: name,
      phone: document.getElementById('c-phone').value,
      metal_limit: parseFloat(document.getElementById('c-metal').value)||0,
      cash_limit:  parseFloat(document.getElementById('c-cash').value)||0
    });
    if(res.status==='success'){
      ['c-name','c-phone','c-metal','c-cash'].forEach(function(id){document.getElementById(id).value='';});
      document.getElementById('c-name').focus();
      loadClients();
    } else alert('Failed: '+(res.message||'Unknown error'));
  }catch(e){ alert('Error: '+e); }
  finally{ btn.disabled=false; btn.textContent='Authorize Account'; }
}

async function removeClient(id){
  if(!confirm('Remove this client and all their data?')) return;
  var res = await window.pywebview.api.delete_master_entry('client', id);
  if(res.status==='success') loadClients();
}

/* Enter-key navigation */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  var el = document.activeElement, nid = el.dataset.next;
  if(!nid) return;
  e.preventDefault();
  var next = document.getElementById(nid);
  if(next) next.tagName==='BUTTON' ? next.click() : next.focus();
});

/* Close modal on overlay click */
document.getElementById('edit-modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

/* ── INIT ── */
window.addEventListener('load', function(){
  /* Restore collapsed state */
  if(localStorage.getItem('sb_collapsed')==='1')
    document.body.classList.add('sidebar-collapsed');

  /* Determine role */
  var urlRole = (location.search.match(/[?&]role=([^&]+)/)||[])[1]||'';
  var lsRole  = '';
  try{ lsRole = localStorage.getItem('aurum_user_role')||''; }catch(e){}
  var role = urlRole || lsRole || 'admin';
  if(urlRole) try{ localStorage.setItem('aurum_user_role', urlRole); }catch(e){}

  buildNav(role==='staff' ? NAV_STAFF : NAV_ADMIN);

  /* Wait for pywebview API */
  var t = setInterval(function(){
    if(!window.pywebview?.api) return;
    clearInterval(t);

    /* Version */
    try{
      window.pywebview.api.get_current_version().then(function(v){
        if(v) document.getElementById('ver-pill').textContent='v'+v;
      }).catch(function(){});
    }catch(e){}

    /* Owner name */
    try{
      window.pywebview.api.get_dynamic_greeting().then(function(g){
        if(!g||g.status!=='success') return;
        var n = g.owner_title||'Director';
        document.getElementById('owner-name').textContent = n;
        document.getElementById('pop-name').textContent   = n;
        document.getElementById('owner-avatar').textContent =
          n.split(' ').filter(Boolean).map(function(w){return w[0];}).join('').substring(0,2).toUpperCase()||'OS';
      }).catch(function(){});
    }catch(e){}

    loadClients();
  }, 100);
});
</script>
