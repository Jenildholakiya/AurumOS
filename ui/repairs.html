<!DOCTYPE html>
<html lang="en">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumOS | Repairs</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="responsive.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--cream:#f8fafb;--cream2:#f1f5f9;--white:#fff;--ink:#0e0c09;--ink3:#5c5a52;--gold:#2563eb;--gold-bg:rgba(37,99,235,0.06);--gold-ln:rgba(37,99,235,0.22);--rule:rgba(14,12,9,0.09);--muted:#64748b;--muted2:#94a3b8;--green:#16a34a;--green-bg:rgba(22,163,74,0.07);--red:#dc2626;--red-bg:rgba(220,38,38,0.06);--amber:#d97706;--amber-bg:rgba(217,119,6,0.07);--sans:'DM Sans',system-ui,sans-serif;--mono:Arial,sans-serif;--sh:0 1px 3px rgba(0,0,0,0.04);}
html,body{height:100%;overflow:hidden;}
body{display:flex;width:100vw;height:100vh;background:var(--cream);font-family:var(--sans);}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--white);}
.topbar h1{font-size:1.1rem;font-weight:700;color:var(--ink);}
.content{flex:1;overflow-y:auto;padding:20px;}
.card{background:var(--white);border:1px solid var(--rule);border-radius:10px;margin-bottom:16px;box-shadow:var(--sh);}
.card-head{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;}
.card-title{font-size:0.88rem;font-weight:700;color:var(--ink);}
.card-body{padding:16px 18px;}
table{width:100%;border-collapse:collapse;font-size:0.78rem;}
th{padding:8px 12px;text-align:left;font-weight:600;color:var(--ink3);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--rule);}
td{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,0.04);}
.btn{padding:7px 16px;border:1px solid var(--gold-ln);background:var(--gold-bg);color:var(--gold);border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:var(--sans);}
.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-sm{padding:4px 10px;font-size:0.68rem;}
.btn-green{background:var(--green-bg);color:var(--green);border-color:rgba(22,163,74,0.22);}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:0.65rem;font-weight:600;}
.pill-received{background:var(--amber-bg);color:var(--amber);}
.pill-inspecting{background:rgba(139,92,246,0.08);color:#7c3aed;}
.pill-in_work{background:rgba(37,99,235,0.08);color:var(--gold);}
.pill-ready{background:var(--green-bg);color:var(--green);}
.pill-delivered{background:var(--cream2);color:var(--ink3);}
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.form-group{flex:1;min-width:140px;}
.form-row label{font-size:0.72rem;font-weight:600;color:var(--ink3);display:block;margin-bottom:4px;}
.form-row input,.form-row select,.form-row textarea{padding:7px 10px;border:1px solid var(--rule);border-radius:6px;font-size:0.8rem;font-family:var(--sans);width:100%;}
.empty{text-align:center;padding:24px;color:var(--muted2);font-size:0.8rem;}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:6px 14px;border-radius:6px;font-size:0.72rem;font-weight:600;cursor:pointer;border:1px solid var(--rule);background:var(--white);color:var(--muted);}
.tab.active{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-ln);}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.stat{flex:1;min-width:100px;padding:12px 16px;background:var(--white);border:1px solid var(--rule);border-radius:8px;text-align:center;}
.stat-val{font-size:1.2rem;font-weight:700;color:var(--ink);}
.stat-lbl{font-size:0.65rem;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div id="sidebar-container"></div>
<script src="sidebar.js?v=4"></script>
<script src="sse_stream.js"></script>
<script>initSidebar('inventory');</script>
<main>
  <div class="topbar">
    <h1>Repair &amp; Alteration Tracking</h1>
    <span id="clock" style="font-size:0.7rem;color:var(--muted);font-family:var(--mono);"></span>
  </div>
  <div class="content">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="st-received">0</div><div class="stat-lbl">Received</div></div>
      <div class="stat"><div class="stat-val" id="st-work">0</div><div class="stat-lbl">In Work</div></div>
      <div class="stat"><div class="stat-val" id="st-ready">0</div><div class="stat-lbl">Ready</div></div>
      <div class="stat"><div class="stat-val" id="st-delivered">0</div><div class="stat-lbl">Delivered</div></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">New Repair Job</span></div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group"><label>Customer Name</label><input type="text" id="rp-cust" /></div>
          <div class="form-group"><label>Phone</label><input type="text" id="rp-phone" /></div>
          <div class="form-group"><label>Promised Date</label><input type="date" id="rp-promise" /></div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:2;"><label>Item Description</label><input type="text" id="rp-item" placeholder="e.g. Gold ring with stone setting" /></div>
          <div class="form-group"><label>Metal</label>
            <select id="rp-metal"><option value="gold">Gold</option><option value="silver">Silver</option></select>
          </div>
          <div class="form-group" style="max-width:100px;"><label>Weight (g)</label><input type="number" id="rp-weight" step="0.001" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Repair Type</label>
            <select id="rp-type">
              <option value="repair">Repair</option>
              <option value="alteration">Alteration</option>
              <option value="polish">Polish</option>
              <option value="resize">Resize</option>
              <option value="rhodium">Rhodium Plating</option>
              <option value="stone_setting">Stone Setting</option>
              <option value="engraving">Engraving</option>
            </select>
          </div>
          <div class="form-group"><label>Estimated Cost</label><input type="number" id="rp-cost" /></div>
          <div class="form-group"><label>Advance Taken</label><input type="number" id="rp-adv" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Notes</label><textarea id="rp-notes" rows="2"></textarea></div>
        </div>
        <button class="btn btn-primary" onclick="submitRepair()">Create Repair Job</button>
      </div>
    </div>

    <div class="tabs" id="filter-tabs">
      <div class="tab active" data-status="" onclick="filterRepairs('')">All</div>
      <div class="tab" data-status="received" onclick="filterRepairs('received')">Received</div>
      <div class="tab" data-status="in_work" onclick="filterRepairs('in_work')">In Work</div>
      <div class="tab" data-status="ready" onclick="filterRepairs('ready')">Ready</div>
      <div class="tab" data-status="delivered" onclick="filterRepairs('delivered')">Delivered</div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Repair Queue</span><span id="rp-count" style="font-size:0.7rem;color:var(--muted);">0</span></div>
      <table>
        <thead><tr><th>Repair No</th><th>Customer</th><th>Item</th><th>Type</th><th>Est. Cost</th><th>Promised</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rp-tbody"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script>
var _allRepairs=[], _filter='';
function fmt(n){return 'Rs. '+parseFloat(n||0).toLocaleString('en-IN',{minimumFractionDigits:0});}
function statusPill(s){
  var cls={'received':'pill-received','inspecting':'pill-inspecting','in_work':'pill-in_work','ready':'pill-ready','delivered':'pill-delivered'}[s]||'pill-received';
  return '<span class="pill '+cls+'">'+(s||'').replace('_',' ').toUpperCase()+'</span>';
}
function nextStatus(s){return {'received':'inspecting','inspecting':'in_work','in_work':'ready','ready':'delivered'}[s]||'';}
function nextLabel(s){return {'received':'Start Inspection','inspecting':'Start Work','in_work':'Mark Ready','ready':'Deliver'}[s]||'';}

function filterRepairs(st){
  _filter=st;
  document.querySelectorAll('#filter-tabs .tab').forEach(function(t){t.classList.toggle('active',t.dataset.status===st);});
  renderRepairs();
}
function renderRepairs(){
  var list=_filter?_allRepairs.filter(function(r){return r.status===_filter;}):_allRepairs;
  document.getElementById('rp-count').textContent=list.length+' jobs';
  var tb=document.getElementById('rp-tbody');
  if(!list.length){tb.innerHTML='<tr><td colspan="8" class="empty">No repair jobs</td></tr>';return;}
  tb.innerHTML=list.map(function(r){
    var ns=nextStatus(r.status), nl=nextLabel(r.status);
    var actions=ns?'<button class="btn btn-sm" onclick="updateRP(\''+r.repair_no+'\',\''+ns+'\')">'+nl+'</button>':'';
    return '<tr><td>'+r.repair_no+'</td><td>'+r.customer+'<br><span style="font-size:0.65rem;color:var(--muted);">'+r.phone+'</span></td>'
      +'<td>'+r.item_desc+'</td><td style="text-transform:capitalize;">'+r.repair_type+'</td>'
      +'<td>'+fmt(r.estimated_cost)+'</td><td>'+r.promised_date+'</td>'
      +'<td>'+statusPill(r.status)+'</td><td>'+actions+'</td></tr>';
  }).join('');
}
async function loadRepairs(){
  var api=window.pywebview&&window.pywebview.api; if(!api) return;
  var r=await api.get_repairs();
  _allRepairs=(r&&r.repairs)||[];
  var counts={received:0,inspecting:0,in_work:0,ready:0,delivered:0};
  _allRepairs.forEach(function(r){counts[r.status]=(counts[r.status]||0)+1;});
  document.getElementById('st-received').textContent=counts.received;
  document.getElementById('st-work').textContent=(counts.inspecting||0)+(counts.in_work||0);
  document.getElementById('st-ready').textContent=counts.ready;
  document.getElementById('st-delivered').textContent=counts.delivered;
  renderRepairs();
}
async function submitRepair(){
  var api=window.pywebview&&window.pywebview.api; if(!api) return;
  var r=await api.create_repair({
    customer:document.getElementById('rp-cust').value, phone:document.getElementById('rp-phone').value,
    item_desc:document.getElementById('rp-item').value, metal_type:document.getElementById('rp-metal').value,
    weight:parseFloat(document.getElementById('rp-weight').value)||0, repair_type:document.getElementById('rp-type').value,
    estimated_cost:parseFloat(document.getElementById('rp-cost').value)||0, advance:parseFloat(document.getElementById('rp-adv').value)||0,
    promised_date:document.getElementById('rp-promise').value, notes:document.getElementById('rp-notes').value
  });
  if(r&&r.status==='success') loadRepairs();
}
async function updateRP(no,st){
  var api=window.pywebview&&window.pywebview.api; if(!api) return;
  await api.update_repair_status(no,st); loadRepairs();
}
function updateClock(){var n=new Date();document.getElementById('clock').textContent=n.toLocaleDateString('en-GB')+' | '+n.toLocaleTimeString();}
setInterval(updateClock,1000);updateClock();
window.addEventListener('load',function(){
  var t=setInterval(function(){if(!window.pywebview||!window.pywebview.api)return;clearInterval(t);loadRepairs();},100);
});
</script>
</body>
</html>
