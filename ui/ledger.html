<!DOCTYPE html>
<html lang="en">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<title>AurumOS | Master Ledger</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="sidebar.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#f8fafb;--cream2:#f1f5f9;--cream3:#e2e8f0;
  --white:#fff;--ink:#0e0c09;--ink2:#2a2620;--ink3:#5c5a52;
  --gold:#2563eb;--gold2:#3b82f6;--gold3:#1d4ed8;
  --gold-bg:rgba(37,99,235,0.06);--gold-ln:rgba(37,99,235,0.22);
  --rule:rgba(14,12,9,0.09);--rule2:rgba(14,12,9,0.05);
  --muted:#64748b;--muted2:#94a3b8;
  --green:#16a34a;--green-bg:rgba(22,163,74,0.06);--green-ln:rgba(22,163,74,0.2);
  --red:#dc2626;--red-bg:rgba(220,38,38,0.06);--red-ln:rgba(220,38,38,0.18);
  --blue:#2563eb;--blue-bg:rgba(37,99,235,0.06);--blue-ln:rgba(37,99,235,0.18);
  --serif:'DM Serif Display',Georgia,serif;
  --mono:Arial,sans-serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --sh:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.02);
}

html,body{height:100%;overflow:hidden;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--cream);color:var(--ink);
  display:flex;flex-direction:row;
  width:100vw;height:100vh;
}

/* Sidebar styling is provided by sidebar.css (shared app shell) */

/* ════════════════════════════════════════
   MAIN
════════════════════════════════════════ */
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;height:100vh;}

header{
  height:58px;background:var(--white);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0;position:relative;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,var(--gold-ln) 50%,transparent 95%);
}
.h-title{font-family:var(--serif);font-size:15px;color:var(--ink);}
.h-title em{color:var(--gold3);font-style:italic;}
.h-sub{font-size:9px;color:var(--muted2);margin-top:1px;}
.h-right{display:flex;gap:8px;align-items:center;}

#clock{font-family:var(--mono);font-size:11px;color:var(--muted2);background:var(--cream2);padding:5px 12px;border-radius:5px;border:1px solid var(--rule);}

.btn-csv{
  height:30px;padding:0 13px;
  background:var(--white);border:1px solid var(--rule);border-radius:6px;
  font-family:inherit;font-size:12px;color:var(--ink3);cursor:pointer;transition:all 0.14s;
}
.btn-csv:hover{border-color:var(--gold-ln);color:var(--gold3);background:var(--gold-bg);}

.btn-print{
  height:30px;padding:0 13px;
  display:inline-flex;align-items:center;gap:5px;
  background:var(--gold-bg);border:1px solid var(--gold-ln);border-radius:6px;
  font-family:inherit;font-size:12px;color:var(--gold3);cursor:pointer;transition:all 0.14s;
}
.btn-print:hover{background:rgba(37,99,235,0.14);}

/* Content */
.content{padding:16px 22px 20px;overflow-y:hidden;flex:1;display:flex;flex-direction:column;gap:14px;}

/* Summary ribbon */
.summary-ribbon{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex-shrink:0;}
.sum-card{
  background:var(--white);padding:13px 16px;
  border-radius:8px;border:1px solid var(--rule);
  box-shadow:var(--sh);position:relative;overflow:hidden;
}
.sum-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.sum-card.dr::before{background:var(--red);}
.sum-card.cr::before{background:var(--green);}
.sum-card label{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:4px;}
.sum-card .val{font-family:var(--serif);font-size:20px;display:block;letter-spacing:-0.3px;}
.sum-card .val.dr{color:var(--red);}
.sum-card .val.cr{color:var(--green);}
.sum-mini{font-size:9px;color:var(--muted2);margin-top:2px;}

/* Table card */
.table-card{
  background:var(--white);border-radius:10px;
  border:1px solid var(--rule);overflow:hidden;
  box-shadow:var(--sh);display:flex;flex-direction:column;flex:1;min-height:0;
}
.table-header{padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
.th-top{display:flex;justify-content:space-between;align-items:center;}
.th-label{font-family:var(--serif);font-size:15px;color:var(--ink);}
.th-label em{color:var(--gold3);font-style:italic;}

.filter-toggle{
  display:flex;background:var(--cream2);padding:3px;
  border-radius:6px;border:1px solid var(--rule);gap:2px;
}
.tgl-btn{
  border:none;padding:5px 13px;border-radius:4px;
  font-family:inherit;font-size:10px;cursor:pointer;
  transition:all 0.15s;background:transparent;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;
}
.tgl-btn.active{background:var(--white);color:var(--ink);box-shadow:var(--sh);}

.filter-bar{
  display:flex;gap:10px;align-items:flex-end;
  background:var(--cream2);padding:10px 12px;border-radius:7px;border:1px solid var(--rule);
}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg.grow{flex:1;}
.fg label{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.07em;}
.fg input{
  height:32px;padding:0 9px;border:1px solid var(--rule);border-radius:5px;
  font-family:inherit;font-size:12px;color:var(--ink);background:var(--white);outline:none;
  transition:border-color 0.14s,box-shadow 0.14s;
}
.fg input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(201,162,39,0.1);}
.btn-reset{
  height:32px;padding:0 13px;background:var(--white);border:1px solid var(--rule);
  border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;color:var(--ink3);transition:all 0.14s;
}
.btn-reset:hover{border-color:var(--red-ln);color:var(--red);background:var(--red-bg);}

/* Table */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  max-height: calc(100vh - 220px); /* Keeps pagination bar completely locked at the baseline */
  scrollbar-width: thin;
  scrollbar-color: var(--cream3) transparent;
}
.scroll-area::-webkit-scrollbar{width:3px;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--cream3);}

table{width:100%;border-collapse:collapse;table-layout:fixed;}
th{
  background:var(--cream2);padding:9px 16px;text-align:left;
  font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.07em;
  border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10;
}
td{padding:10px 16px;border-bottom:1px solid var(--rule2);font-size:12px;transition:background 0.1s;}
tr.row-paid td{background:rgba(21,128,61,0.025);}
tr.row-credit td{background:rgba(185,28,28,0.025);}
tr:hover td{filter:brightness(0.97);cursor:default;}

.status-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:4px;font-size:9px;
  text-transform:uppercase;letter-spacing:0.04em;border:1px solid transparent;
}
.badge-paid{background:var(--green-bg);color:var(--green);border-color:var(--green-ln);}
.badge-credit{background:var(--red-bg);color:var(--red);border-color:var(--red-ln);}
.badge-jama{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-ln);}

.client-pill{
  background:var(--cream2);padding:3px 9px;border-radius:4px;
  font-size:11px;border:1px solid var(--rule);display:inline-block;color:var(--ink3);
}
.num-text{font-family:var(--mono);font-size:12px;}
.text-dr{color:var(--red)!important;}
.text-cr{color:var(--green)!important;}
.vch-ref{color:var(--ink);font-size:12px;}
.vch-desc{font-size:10px;color:var(--muted2);margin-top:1px;}
.empty-cell{text-align:center;padding:40px;color:var(--muted2);font-size:13px;}
</style>
</head>
<body>

<script src="sidebar.js?v=2"></script>
<div id="sidebar-container"></div>

<!-- ════════════════════════════════════════
     MAIN
════════════════════════════════════════ -->
<main>
  <header>
    <div>
      <div class="h-title">Master <em>Ledger</em></div>
      <div class="h-sub">Global Transaction Register</div>
    </div>
    <div class="h-right">
      <div id="clock">-- | --</div>
      <button class="btn-csv" onclick="exportToCSV()">Export CSV</button>
      <button class="btn-print" onclick="printLedger()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        Print Ledger
      </button>
    </div>
  </header>

  <div class="content">

    <!-- Summary ribbon -->
    <div class="summary-ribbon">
      <div class="sum-card dr">
        <label>Metal DR</label>
        <span class="val dr" id="total-m-dr">0.000 g</span>
        <div class="sum-mini">Market Udhar</div>
      </div>
      <div class="sum-card dr">
        <label>Cash DR</label>
        <span class="val dr" id="total-c-dr">Rs. 0.00</span>
        <div class="sum-mini">Pending Payments</div>
      </div>
      <div class="sum-card cr">
        <label>Metal CR</label>
        <span class="val cr" id="total-m-cr">0.000 g</span>
        <div class="sum-mini">Total Jama</div>
      </div>
      <div class="sum-card cr">
        <label>Cash CR</label>
        <span class="val cr" id="total-c-cr">Rs. 0.00</span>
        <div class="sum-mini">Total Received</div>
      </div>
    </div>

    <!-- Table card -->
    <div class="table-card">
      <div class="table-header">
        <div class="th-top">
          <div class="th-label">Transaction <em>Stream</em></div>
          <div class="filter-toggle">
            <button class="tgl-btn active" id="btn-all"    onclick="setFilter('all')">All</button>
            <button class="tgl-btn"        id="btn-paid"   onclick="setFilter('paid')">Paid</button>
            <button class="tgl-btn"        id="btn-credit" onclick="setFilter('credit')">Credit</button>
            <button class="tgl-btn"        id="btn-jama"   onclick="setFilter('jama')">Jama</button>
          </div>
        </div>
        <div class="filter-bar">
          <div class="fg"><label>From</label><input type="date" id="date-from" onchange="filterLedger()"></div>
          <div class="fg"><label>To</label><input type="date" id="date-to" onchange="filterLedger()"></div>
          <div class="fg grow"><label>Search</label><input type="text" id="ledger-search" placeholder="Client, voucher or note…" oninput="filterLedger()"></div>
          <button class="btn-reset" onclick="resetFilters()">Reset</button>
        </div>
      </div>
      <div class="scroll-area">
        <table>
          <thead>
            <tr>
              <th style="width:110px;">Date</th>
              <th style="width:160px;">Account</th>
              <th>Reference &amp; Description</th>
              <th style="width:100px;text-align:center;">Status</th>
              <th style="width:140px;text-align:right;">Metal</th>
              <th style="width:155px;text-align:right;">Cash</th>
            </tr>
          </thead>
          <tbody id="ledger-tbody">
            <tr><td colspan="6" class="empty-cell">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<script>
'use strict';

/* Sidebar is rendered by the shared shell (sidebar.js / sidebar.css) */

/* ── CLOCK ── */
function updateClock() {
  var n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' | ' + n.toLocaleTimeString();
}
setInterval(updateClock, 1000); updateClock();

/* ── LEDGER DATA ── */
var masterData   = [];
var filteredData = [];
var activeFilter = 'all';

function hesc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function classify(e) {
  var mCr = parseFloat(e.metal_cr||0), cCr = parseFloat(e.cash_cr||0);
  var mDr = parseFloat(e.metal_dr||0), cDr = parseFloat(e.cash_dr||0);
  if (cCr > 0) return 'paid';
  if (mCr > 0) return 'jama';
  if (mDr > 0 || cDr > 0) return 'credit';
  return 'credit';
}

function fetchLedger() {
  if (!window.pywebview || !window.pywebview.api) return;
  window.pywebview.api.get_ledger_summary().then(function(s) {
    document.getElementById('total-m-dr').textContent = parseFloat(s.metal_dr||0).toFixed(3) + ' g';
    document.getElementById('total-c-dr').textContent = 'Rs. ' + parseFloat(s.cash_dr||0).toLocaleString('en-IN', {minimumFractionDigits:2});
    document.getElementById('total-m-cr').textContent = parseFloat(s.metal_cr||0).toFixed(3) + ' g';
    document.getElementById('total-c-cr').textContent = 'Rs. ' + parseFloat(s.cash_cr||0).toLocaleString('en-IN', {minimumFractionDigits:2});
  }).catch(function(){});

  window.pywebview.api.get_full_ledger_stream().then(function(data) {
    masterData = data || [];
    filterLedger();
  }).catch(function(e) { console.error(e); });
}

function setFilter(type) {
  activeFilter = type;
  document.querySelectorAll('.tgl-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btn-' + type).classList.add('active');
  filterLedger();
}

function resetFilters() {
  document.getElementById('ledger-search').value = '';
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  setFilter('all');
}

var uiCurrentPage = 1;
var uiRowsPerPage = 50; // Limits DOM painting for instantaneous data loading

function filterLedger() {
  var q    = document.getElementById('ledger-search').value.toLowerCase();
  var from = document.getElementById('date-from').value;
  var to   = document.getElementById('date-to').value;

  filteredData = masterData.filter(function(e) {
    var rt = classify(e);
    var matchText = !q
      || (e.client_name||'').toLowerCase().indexOf(q) > -1
      || (e.vch_reference||'').toLowerCase().indexOf(q) > -1
      || (e.description||'').toLowerCase().indexOf(q) > -1;
    var matchType = activeFilter === 'all' || activeFilter === rt;
    var matchDate = (!from || e.date >= from) && (!to || e.date <= to);
    return matchText && matchType && matchDate;
  });

  uiCurrentPage = 1; // Reset to page 1 on active filtering
  renderTable(filteredData);
}

function renderTable(data) {
  var tbody = document.getElementById('ledger-tbody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-cell">No transactions found.</td></tr>';
    return;
  }

  // Calculate high-speed window boundaries
  var start = (uiCurrentPage - 1) * uiRowsPerPage;
  var end = start + uiRowsPerPage;
  var paginatedSlice = data.slice(start, end);

  // Map only the visible window slice to prevent browser rendering lag
  tbody.innerHTML = paginatedSlice.map(function(e, localIdx) {
    var globalIdx = start + localIdx + 1;
    var mDr=parseFloat(e.metal_dr||0), mCr=parseFloat(e.metal_cr||0);
    var cDr=parseFloat(e.cash_dr||0),  cCr=parseFloat(e.cash_cr||0);
    var rt  = classify(e);
    var rc  = (rt==='paid'||rt==='jama') ? 'row-paid' : 'row-credit';
    var badge = rt==='paid'
      ? '<span class="status-badge badge-paid">Paid</span>'
      : rt==='jama'
      ? '<span class="status-badge badge-jama">Jama</span>'
      : '<span class="status-badge badge-credit">Credit</span>';
    var mTxt='--', mCls='';
    if(mDr>0){ mTxt='+'+mDr.toFixed(3)+' g DR'; mCls='text-dr'; }
    else if(mCr>0){ mTxt='-'+mCr.toFixed(3)+' g CR'; mCls='text-cr'; }
    var cTxt='--', cCls='';
    if(cDr>0){ cTxt='Rs.'+cDr.toLocaleString('en-IN',{minimumFractionDigits:2})+' DR'; cCls='text-dr'; }
    else if(cCr>0){ cTxt='Rs.'+cCr.toLocaleString('en-IN',{minimumFractionDigits:2})+' CR'; cCls='text-cr'; }

    return '<tr class="' + rc + '">'
      + '<td style="font-family:var(--mono);font-size:11px;color:var(--muted2);">' + hesc(e.date||'--') + '</td>'
      + '<td><span class="client-pill">' + hesc(e.client_name||'System') + '</span></td>'
      + '<td><div class="vch-ref">' + hesc(e.vch_reference||'Manual') + '</div>'
      +     '<div class="vch-desc">' + hesc(e.description||'') + '</div></td>'
      + '<td style="text-align:center;">' + badge + '</td>'
      + '<td style="text-align:right;" class="num-text ' + mCls + '">' + mTxt + '</td>'
      + '<td style="text-align:right;" class="num-text ' + cCls + '">' + cTxt + '</td>'
      + '</tr>';
  }).join('');

  // Append simple on-screen pagination triggers if total entries outgrow the view window
  renderUiPaginationControls(data.length);
}

function renderUiPaginationControls(totalEntries) {
  var totalPages = Math.ceil(totalEntries / uiRowsPerPage);
  var existingControls = document.getElementById('ui-pagination-bar');
  if (existingControls) existingControls.remove();

  if (totalPages <= 1) return;

  var mainCard = document.querySelector('.table-card');
  var navBar = document.createElement('div');
  navBar.id = 'ui-pagination-bar';
  navBar.style.cssText = 'padding:10px 18px; border-top:1px solid var(--rule); background:var(--cream2); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; font-size:12px;';

  navBar.innerHTML = '<span>Showing ' + Math.min(totalEntries, ((uiCurrentPage - 1) * uiRowsPerPage) + 1) + '-' + Math.min(totalEntries, uiCurrentPage * uiRowsPerPage) + ' of ' + totalEntries + ' entries</span>'
    +'<div style="display:flex; gap:6px;">'
    +'  <button class="btn-csv" ' + (uiCurrentPage === 1 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : '') + ' onclick="changeUiPage(-1)">Previous</button>'
    +'  <button class="btn-csv" ' + (uiCurrentPage === totalPages ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : '') + ' onclick="changeUiPage(1)">Next</button>'
    +'</div>';

  mainCard.appendChild(navBar);
}

function changeUiPage(direction) {
  uiCurrentPage += direction;
  renderTable(filteredData);
}

/* ── EXPORT CSV ── */
function exportToCSV() {
  if (!masterData.length) return;
  var hdr = ['Date','Account','Reference','Description','Status','Metal DR','Metal CR','Cash DR','Cash CR'];
  var rows = masterData.map(function(e) {
    return [e.date, e.client_name, e.vch_reference||'Manual', e.description,
            classify(e).toUpperCase(), e.metal_dr, e.metal_cr, e.cash_dr, e.cash_cr];
  });
  var csv = 'data:text/csv;charset=utf-8,' + hdr.join(',') + '\n' + rows.map(function(r){ return r.join(','); }).join('\n');
  var a = document.createElement('a');
  a.setAttribute('href', encodeURI(csv));
  a.setAttribute('download', 'Master_Ledger_' + new Date().toLocaleDateString().replace(/\//g,'-') + '.csv');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ── POWERFUL PAGED PRINT ENGINE (WITH HEADER CENTERING & TYPOGRAPHY BALANCING) ── */
function printLedger() {
  var data = filteredData.length ? filteredData : masterData;
  if (!data.length) { alert('No data to print.'); return; }

  function build(biz) {
    var now   = new Date();
    var dtStr = now.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    var tmStr = now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
    var from  = document.getElementById('date-from').value || 'All';
    var to    = document.getElementById('date-to').value   || 'Today';
    var filterLabel = activeFilter==='all' ? 'All Transactions' : activeFilter.charAt(0).toUpperCase()+activeFilter.slice(1)+' Only';
    var B = '1px solid rgba(14,12,9,0.08)';

    var totMDr=0, totMCr=0, totCDr=0, totCCr=0;
    data.forEach(function(e){
      totMDr+=parseFloat(e.metal_dr||0);
      totMCr+=parseFloat(e.metal_cr||0);
      totCDr+=parseFloat(e.cash_dr||0);
      totCCr+=parseFloat(e.cash_cr||0);
    });

    var chunkSize = 25;
    var totalPages = Math.ceil(data.length / chunkSize);
    var pagesHtml = '';

    for (var p = 0; p < data.length; p += chunkSize) {
      var currentPageIndex = Math.floor(p / chunkSize) + 1;
      var chunk = data.slice(p, p + chunkSize);
      var isLastPage = (currentPageIndex === totalPages);

      var rowsHtml = chunk.map(function(e, idx) {
        var globalIdx = p + idx + 1;
        var mDr=parseFloat(e.metal_dr||0), mCr=parseFloat(e.metal_cr||0);
        var cDr=parseFloat(e.cash_dr||0),  cCr=parseFloat(e.cash_cr||0);
        var rt  = classify(e);
        var bg  = idx%2===0 ? '#fff' : '#faf8f3';
        var stc = rt==='paid'?'#15803d':rt==='jama'?'#1d4ed8':'#b91c1c';
        var stbg= rt==='paid'?'rgba(21,128,61,0.08)':rt==='jama'?'rgba(29,78,216,0.08)':'rgba(185,28,28,0.08)';
        var stbd= rt==='paid'?'rgba(21,128,61,0.2)':rt==='jama'?'rgba(29,78,216,0.2)':'rgba(185,28,28,0.18)';
        var mTxt= mDr>0?'+'+mDr.toFixed(3)+' g Dr':mCr>0?'-'+mCr.toFixed(3)+' g Cr':'--';
        var mCol= mDr>0?'#b91c1c':mCr>0?'#15803d':'#9e9890';
        var cTxt= cDr>0?'Rs.'+cDr.toLocaleString('en-IN',{minimumFractionDigits:2})+' Dr':cCr>0?'Rs.'+cCr.toLocaleString('en-IN',{minimumFractionDigits:2})+' Cr':'--';
        var cCol= cDr>0?'#b91c1c':cCr>0?'#15803d':'#9e9890';

        return '<tr style="background:'+bg+';">'
          +'<td style="padding:4px 6px;text-align:center;font-family:Arial,sans-serif;font-size:6pt;color:#9e9890;border-right:'+B+';border-bottom:'+B+';">'+globalIdx+'</td>'
          +'<td style="padding:4px 7px;font-family:Arial,sans-serif;font-size:7pt;color:#5c5a52;border-right:'+B+';border-bottom:'+B+';">'+hesc(e.date||'--')+'</td>'
          +'<td style="padding:4px 8px;border-right:'+B+';border-bottom:'+B+';"><span style="background:#f2efe7;padding:2px 7px;border-radius:3px;font-size:7pt;border:0.5px solid rgba(14,12,9,0.08);">'+hesc(e.client_name||'System')+'</span></td>'
          +'<td style="padding:4px 8px;border-right:'+B+';border-bottom:'+B+';"><div style="font-size:7.5pt;color:#0e0c09;">'+hesc(e.vch_reference||'Manual')+'</div><div style="font-size:6pt;color:#9e9890;margin-top:1px;">'+hesc(e.description||'')+'</div></td>'
          +'<td style="padding:4px 7px;text-align:center;border-right:'+B+';border-bottom:'+B+';"><span style="padding:2px 7px;border-radius:3px;font-size:6pt;text-transform:uppercase;letter-spacing:0.3px;background:'+stbg+';color:'+stc+';border:0.5px solid '+stbd+';">'+rt+'</span></td>'
          +'<td style="padding:4px 8px;text-align:right;font-family:Arial,sans-serif;font-size:7.5pt;color:'+mCol+';border-right:'+B+';border-bottom:'+B+';">'+mTxt+'</td>'
          +'<td style="padding:4px 8px;text-align:right;font-family:Arial,sans-serif;font-size:7.5pt;color:'+cCol+';border-bottom:'+B+';">'+cTxt+'</td>'
          +'</tr>';
      }).join('');

      var totalRenderedRows = chunk.length;
      var targetedPaddingCount = chunkSize - totalRenderedRows;

      for (var p_pad = 0; p_pad < targetedPaddingCount; p_pad++) {
        var dummyBg = (totalRenderedRows + p_pad) % 2 === 0 ? '#fff' : '#faf8f3';
        rowsHtml += '<tr style="background:' + dummyBg + '; height: 25px;">'
          +'<td style="border-right:'+B+'; border-bottom:'+B+';">&nbsp;</td>'
          +'<td style="border-right:'+B+'; border-bottom:'+B+';">&nbsp;</td>'
          +'<td style="border-right:'+B+'; border-bottom:'+B+';">&nbsp;</td>'
          +'<td style="border-right:'+B+'; border-bottom:'+B+';">&nbsp;</td>'
          +'<td style="border-right:'+B+'; border-bottom:'+B+';">&nbsp;</td>'
          +'<td style="border-right:'+B+'; border-bottom:'+B+';">&nbsp;</td>'
          +'<td style="border-bottom:'+B+';">&nbsp;</td>'
          +'</tr>';
      }

      // ── RE-ENGINEERED TOTALS BAR: INCREASED FONT SIZES & ARlAL WEIGHTS ──
      var totalsBoxHtml = '';
      if (isLastPage) {
        totalsBoxHtml = '<div style="background: #e3d9be; border:1px solid rgba(14,12,9,0.12); border-top:none; border-radius:0 0 6px 6px; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; z-index:5; position:relative; margin-top:-1px;">'
          +'  <div style="font-family: Arial, Helvetica, sans-serif; font-size:10pt; font-weight:700; color:var(--gold3); text-transform:uppercase; letter-spacing:0.5px;">TOTALS ('+data.length+' entries)</div>'
          +'  <div style="display:flex; gap:50px; font-family: Arial, Helvetica, sans-serif; font-size:11pt; text-align:right; font-weight:700; line-height:1.4;">'
          +'    <div>'
          +'      <div style="color:var(--red);">'+totMDr.toFixed(3)+' g Dr</div>'
          +'      <div style="color:var(--green); margin-top:2px;">'+totMCr.toFixed(3)+' g Cr</div>'
          +'    </div>'
          +'    <div style="min-width:140px; font-size:12pt;">'
          +'      <div style="color:var(--red);">Rs.'+totCDr.toLocaleString('en-IN',{minimumFractionDigits:2})+'</div>'
          +'      <div style="color:var(--green); margin-top:2px;">Rs.'+totCCr.toLocaleString('en-IN',{minimumFractionDigits:2})+'</div>'
          +'    </div>'
          +'  </div>'
          +'</div>';
      }

      pagesHtml += '<div class="print-page">'
        +'<div class="wm">Aurum<em>OS</em></div>'
        +'<div class="top-bar"></div>'
        +'<div class="hdr">'
        +'  <div class="brand-container-left"><div class="brand">Aurum<em>OS</em></div><div class="brand-sub">Jewellery Business Management</div><div class="brand-acc"><div class="brand-dash"></div><span class="brand-lbl">Master Ledger</span></div></div>'
        +'  <div class="rpt-r">'
        +     (biz.name?'<div class="biz">'+hesc(biz.name)+'</div>':'')+(biz.city?'<div class="meta">'+hesc(biz.city)+(biz.phone?' | '+hesc(biz.phone):'')+'</div>':'')
        +'    <div class="rpt-title">Global Transaction <em>Ledger</em></div>'
        +'    <div class="meta">Period: '+hesc(from)+' to '+hesc(to)+'<br>Printed: '+dtStr+' at '+tmStr+'</div>'
        +'    <div class="badge">'+filterLabel+'</div>'
        +'  </div>'
        +'</div>'
        + (currentPageIndex === 1 ? '<div class="sums"><div class="sb r"><div class="sl">Metal DR</div><div class="sv">'+totMDr.toFixed(3)+' g</div></div><div class="sb r"><div class="sl">Cash DR</div><div class="sv">Rs.'+totCDr.toLocaleString('en-IN',{minimumFractionDigits:2})+'</div></div><div class="sb g"><div class="sl">Metal CR</div><div class="sv">'+totMCr.toFixed(3)+' g</div></div><div class="sb g"><div class="sl">Cash CR</div><div class="sv">Rs.'+totCCr.toLocaleString('en-IN',{minimumFractionDigits:2})+'</div></div></div>' : '')
        +'<table class="tbl">'
        +'  <thead><tr class="hr"><th style="width:24px;text-align:center;">#</th><th style="min-width:68px;">Date</th><th style="min-width:88px;">Account</th><th>Reference / Description</th><th style="min-width:52px;text-align:center;">Status</th><th class="tr" style="min-width:88px;">Metal</th><th class="tr" style="min-width:108px;">Cash</th></tr></thead>'
        +'  <tbody>'+rowsHtml+'</tbody>'
        +'</table>'
        + totalsBoxHtml
        +'<div class="print-footer">'
        +'  <div class="sigs"><div class="sig"><div class="sigline">Prepared By</div></div><div class="sig"><div class="sigline">Checked By</div></div><div class="sig"><div class="sigline">Authorised Signatory</div></div></div>'
        +'  <div class="fbar">'
        +'    <div class="ftxt"><div>System-generated ledger from AurumOS Jewellery Management.</div><div>Page '+currentPageIndex+' of '+totalPages+' — Generated: '+dtStr+' at '+tmStr+'.</div></div>'
        +'    <div style="text-align: right;"><div class="fbrand">Aurum<em>OS</em></div><div class="fbsub">Jewellery Business Management</div></div>'
        +'  </div>'
        +'  <div class="bot-bar"></div>'
        +'</div>'
        +'</div>';
    }

    var html = '<!DOCTYPE html><html><head>'
      +'<meta charset="UTF-8"><title>AurumOS Master Ledger</title>'
      +'<style>'
      +'@page{size:A4 portrait;margin:0;}'
      +'*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-sizing:border-box;margin:0;padding:0;}'
      +'html,body{font-family:Arial,Helvetica,sans-serif;color:#0e0c09;background:#fff;}'
      +'.print-page{width:210mm;height:297mm;position:relative;page-break-after:always;background:#fff;padding:8mm 10mm 42mm 10mm;overflow:hidden;}'
      +'.print-page:last-child{page-break-after:avoid;}'
      +'.wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);font-family:Georgia,serif;font-size:72pt;color:rgba(168,125,30,0.04);white-space:nowrap;letter-spacing:4px;user-select:none;pointer-events:none;z-index:0;}.wm em{font-style:italic;}'
      +'.top-bar{height:6px;background:linear-gradient(90deg,#8a6c0a,#a87d1e,#c9a227,#a87d1e,#8a6c0a);margin:-8mm -10mm 0 -10mm;}'
      +'.hdr{display:flex;justify-content:space-between;align-items:center;padding:5mm 0 4mm;border-bottom:1.5px solid rgba(168,125,30,0.22);margin-bottom:4mm;}'
      +'.brand-container-left{display:flex;flex-direction:column;justify-content:center;text-align:left;}'
      +'.brand{font-family:Georgia,serif;font-size:32pt;font-weight:700;color:#0e0c09;line-height:0.95;letter-spacing:-1.2px;}'
      +'.brand em{color:#8a6c0a;font-style:italic;}'
      +'.brand-sub{font-size:7.5pt;font-weight:600;color:#7a7268;text-transform:uppercase;letter-spacing:0.8px;margin-top:4px;}'
      +'.brand-acc{display:flex;align-items:center;gap:5px;margin-top:5px;}'
      +'.brand-dash{height:2px;width:16px;background:linear-gradient(90deg,#a87d1e,#c9a227);border-radius:99px;}'
      +'.brand-lbl{font-size:5.5pt;color:#a87d1e;text-transform:uppercase;letter-spacing:0.8px;}'
      +'.rpt-r{text-align:right;}.biz{font-family:Georgia,serif;font-size:14pt;color:#0e0c09;}'
      +'.rpt-title{font-family:Georgia,serif;font-size:11pt;color:#0e0c09;margin-top:4px;}.rpt-title em{color:#8a6c0a;font-style:italic;}'
      +'.meta{font-size:6.5pt;color:#7a7268;margin-top:3px;line-height:1.6;}'
      +'.badge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:4px;background:rgba(168,125,30,0.08);border:1px solid rgba(168,125,30,0.2);font-size:6pt;color:#8a6c0a;font-family:Arial,sans-serif;}'
      +'.sums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:4mm;}'
      +'.sb{border:1px solid rgba(14,12,9,0.1);border-radius:5px;padding:6px 9px;}'
      +'.sb.r{border-top:3px solid #b91c1c;background:#fff1f2;}.sb.g{border-top:3px solid #15803d;background:#f0fdf4;}'
      +'.sl{font-size:5.5pt;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:3px;}'
      +'.sb.r .sl{color:#f87171;}.sb.g .sl{color:#22c55e;}'
      +'.sv{font-family:Arial,sans-serif;font-size:11pt;line-height:1;}.sb.r .sv{color:#b91c1c;}.sb.g .sv{color:#15803d;}'
      +'.tbl{width:100%;border-collapse:collapse;border:1px solid rgba(14,12,9,0.1);border-bottom:none;z-index:1;position:relative;}'
      +'.tbl .hr th{padding:5px 7px;font-size:6pt;text-transform:uppercase;letter-spacing:0.5px;text-align:left;border-right:1px solid rgba(14,12,9,0.08);border-bottom:2px solid rgba(14,12,9,0.12);background:#faf8f3;color:#7a7268;}'
      +'.tbl .hr th.tr{text-align:right;}.tbl td{vertical-align:middle;}'
      +'.print-footer{position:absolute;bottom:0;left:10mm;right:10mm;padding-bottom:4mm;background:#fff;}'
      +'.sigs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:4mm;}'
      +'.sig{text-align:center;padding:0 10px;}'
      +'.sigline{border-top:1px solid rgba(14,12,9,0.2);padding-top:4px;font-size:6pt;color:#7a7268;}'
      +'.fbar{padding:3mm 0 0;border-top:1px solid rgba(168,125,30,0.18);display:flex;justify-content:space-between;align-items:flex-end;}'
      +'.ftxt{font-size:5.5pt;color:#9e9890;line-height:1.8;}'
      +'.fbrand{font-family:Georgia,serif;font-size:20pt;font-weight:700;color:#0e0c09;line-height:1;}.fbrand em{color:#8a6c0a;font-style:italic;}'
      +'.fbsub{font-size:7pt;font-weight:600;color:#9e9890;letter-spacing:0.5px;text-transform:uppercase;margin-top:2px;}'
      +'.bot-bar{height:5px;background:linear-gradient(90deg,#8a6c0a,#a87d1e,#c9a227,#a87d1e,#8a6c0a);margin-top:4mm;}'
      +'</style></head><body>'
      +pagesHtml
      +'</body></html>';

    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_print_window) {
      window.pywebview.api.open_print_window(html).then(function(r) {
        if (r && r.status !== 'success') alert('Error: ' + (r.message||'unknown'));
      }).catch(function(e) { alert('Print error: ' + e); });
    } else {
      var w = window.open('', '_blank', 'width=900,height=750');
      w.document.open(); w.document.write(html); w.document.close();
    }
  }

  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_settings) {
    window.pywebview.api.get_settings().then(function(res) {
      var biz = {name:'',city:'',phone:''};
      if (res && res.data) { var d=res.data; biz.name=d.business_name||d.owner_name||''; biz.city=d.city||''; biz.phone=d.owner_phone||''; }
      build(biz);
    }).catch(function() { build({name:'',city:'',phone:''}); });
  } else { build({name:'',city:'',phone:''}); }
}

/* ── INIT ── */
(function() {
  initSidebar('ledger');

  /* Wait for pywebview, then load ledger data */
  var _t = setInterval(function() {
    if (!window.pywebview || !window.pywebview.api) return;
    clearInterval(_t);
    fetchLedger();
  }, 100);
})();
</script>
