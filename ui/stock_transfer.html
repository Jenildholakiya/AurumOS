<!DOCTYPE html>
<html lang="en">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumOS | Stock Transfer</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="responsive.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--cream:#f8fafb;--cream2:#f1f5f9;--white:#fff;--ink:#0e0c09;--ink3:#5c5a52;--gold:#2563eb;--gold-bg:rgba(37,99,235,0.06);--gold-ln:rgba(37,99,235,0.22);--rule:rgba(14,12,9,0.09);--muted:#64748b;--muted2:#94a3b8;--green:#16a34a;--green-bg:rgba(22,163,74,0.07);--amber:#d97706;--amber-bg:rgba(217,119,6,0.07);--sans:'DM Sans',system-ui,sans-serif;--mono:Arial,sans-serif;--sh:0 1px 3px rgba(0,0,0,0.04);}
html,body{height:100%;overflow:hidden;}
body{display:flex;width:100vw;height:100vh;background:var(--cream);font-family:var(--sans);}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--white);}
.topbar h1{font-size:1.1rem;font-weight:700;color:var(--ink);}
.content{flex:1;overflow-y:auto;padding:20px;}
.card{background:var(--white);border:1px solid var(--rule);border-radius:10px;margin-bottom:16px;box-shadow:var(--sh);}
.card-head{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;}
.card-title{font-size:0.88rem;font-weight:700;color:var(--ink);}
.card-body{padding:16px 18px;}
table{width:100%;border-collapse:collapse;font-size:0.78rem;}
th{padding:8px 12px;text-align:left;font-weight:600;color:var(--ink3);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--rule);}
td{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,0.04);}
.btn{padding:7px 16px;border:1px solid var(--gold-ln);background:var(--gold-bg);color:var(--gold);border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:var(--sans);}
.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-sm{padding:4px 10px;font-size:0.68rem;}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:0.65rem;font-weight:600;}
.pill-pending{background:var(--amber-bg);color:var(--amber);}
.pill-approved{background:rgba(37,99,235,0.08);color:var(--gold);}
.pill-in_transit{background:rgba(139,92,246,0.08);color:#7c3aed;}
.pill-received{background:var(--green-bg);color:var(--green);}
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.form-group{flex:1;min-width:140px;}
.form-row label{font-size:0.72rem;font-weight:600;color:var(--ink3);display:block;margin-bottom:4px;}
.form-row input,.form-row select,.form-row textarea{padding:7px 10px;border:1px solid var(--rule);border-radius:6px;font-size:0.8rem;font-family:var(--sans);width:100%;}
.empty{text-align:center;padding:24px;color:var(--muted2);font-size:0.8rem;}
</style>
</head>
<body>
<script src="sidebar.js?v=4"></script>
<script src="sse_stream.js"></script>
<script>initSidebar('inventory');</script>
<main>
  <div class="topbar">
    <h1>Stock Transfer</h1>
    <span id="clock" style="font-size:0.7rem;color:var(--muted);font-family:var(--mono);"></span>
  </div>
  <div class="content">
    <div class="card">
      <div class="card-head"><span class="card-title">Create Transfer</span></div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group"><label>From Location</label><input type="text" id="tf-from" placeholder="e.g. Main Store" /></div>
          <div class="form-group"><label>To Location</label><input type="text" id="tf-to" placeholder="e.g. Branch 2" /></div>
          <div class="form-group"><label>Date</label><input type="date" id="tf-date" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Items (description)</label><input type="text" id="tf-items" placeholder="e.g. 5 gold rings, 3 chains" /></div>
          <div class="form-group" style="max-width:120px;"><label>Total Weight (g)</label><input type="number" id="tf-weight" step="0.001" /></div>
          <div class="form-group" style="max-width:80px;"><label>Pcs</label><input type="number" id="tf-pcs" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Notes</label><textarea id="tf-notes" rows="2"></textarea></div>
        </div>
        <button class="btn btn-primary" onclick="submitTransfer()">Create Transfer</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">Transfer History</span><span id="tf-count" style="font-size:0.7rem;color:var(--muted);">0</span></div>
      <table>
        <thead><tr><th>Transfer No</th><th>From</th><th>To</th><th>Date</th><th style="text-align:right;">Weight</th><th>Pcs</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tf-tbody"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script>
function statusPill(s){
  var cls={'pending':'pill-pending','approved':'pill-approved','in_transit':'pill-in_transit','received':'pill-received'}[s]||'pill-pending';
  return '<span class="pill '+cls+'">'+(s||'').replace('_',' ').toUpperCase()+'</span>';
}
document.getElementById('tf-date').value=new Date().toISOString().split('T')[0];

async function loadTransfers(){
  var api=window.pywebview&&window.pywebview.api; if(!api) return;
  var r=await api.get_stock_transfers();
  var list=(r&&r.transfers)||[];
  document.getElementById('tf-count').textContent=list.length+' transfers';
  var tb=document.getElementById('tf-tbody');
  if(!list.length){tb.innerHTML='<tr><td colspan="8" class="empty">No transfers yet</td></tr>';return;}
  tb.innerHTML=list.map(function(t){
    var actions='';
    if(t.status==='pending') actions='<button class="btn btn-sm" onclick="updateTF(\''+t.transfer_no+'\',\'approved\')">Approve</button>';
    else if(t.status==='approved') actions='<button class="btn btn-sm" onclick="updateTF(\''+t.transfer_no+'\',\'in_transit\')">Ship</button>';
    else if(t.status==='in_transit') actions='<button class="btn btn-sm" onclick="updateTF(\''+t.transfer_no+'\',\'received\')">Receive</button>';
    return '<tr><td>'+t.transfer_no+'</td><td>'+t.from_location+'</td><td>'+t.to_location+'</td><td>'+t.date+'</td>'
      +'<td style="text-align:right;">'+parseFloat(t.total_weight||0).toFixed(3)+' g</td><td>'+t.total_pcs+'</td>'
      +'<td>'+statusPill(t.status)+'</td><td>'+actions+'</td></tr>';
  }).join('');
}
async function submitTransfer(){
  var api=window.pywebview&&window.pywebview.api; if(!api) return;
  var r=await api.create_stock_transfer({
    from:document.getElementById('tf-from').value,to:document.getElementById('tf-to').value,
    date:document.getElementById('tf-date').value,
    items:[{desc:document.getElementById('tf-items').value}],
    total_weight:parseFloat(document.getElementById('tf-weight').value)||0,
    total_pcs:parseInt(document.getElementById('tf-pcs').value)||0,
    notes:document.getElementById('tf-notes').value
  });
  if(r&&r.status==='success') loadTransfers();
}
async function updateTF(no,st){
  var api=window.pywebview&&window.pywebview.api; if(!api) return;
  await api.update_transfer_status(no,st); loadTransfers();
}
function updateClock(){var n=new Date();document.getElementById('clock').textContent=n.toLocaleDateString('en-GB')+' | '+n.toLocaleTimeString();}
setInterval(updateClock,1000);updateClock();
window.addEventListener('load',function(){
  var t=setInterval(function(){if(!window.pywebview||!window.pywebview.api)return;clearInterval(t);loadTransfers();},100);
});
</script>
</body>
</html>
