<!DOCTYPE html>
<html lang="en">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AurumOS | Party Terminal</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="sidebar.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
:root{
    --primary:#0f172a;--accent:#2563eb;--accent2:#3b82f6;--accent3:#1d4ed8;
    --accent-light:rgba(37,99,235,0.06);--accent-glow:rgba(37,99,235,0.08);
    --bg-main:#f8fafb;--card:#ffffff;--border:#e2e8f0;--light:#f1f5f9;--white:#ffffff;
    --text-main:#0f172a;--text-muted:#64748b;--text-muted2:#94a3b8;
    --success:#16a34a;--warning:#b45309;--error:#dc2626;
    --shadow-lux:0 1px 3px rgba(15,23,42,0.04),0 4px 16px rgba(15,23,42,0.06);
    --shadow-hover:0 8px 28px rgba(37,99,235,0.12),0 2px 8px rgba(15,23,42,0.04);
    --blue-ln:rgba(37,99,235,0.18);--green-ln:rgba(22,163,74,0.18);
    --ink:#0f172a;--ink2:#1e293b;--ink3:#475569;
    --cream:#f8fafb;--cream2:#f1f5f9;--cream3:#e2e8f0;
    --rule:#e2e8f0;--rule2:rgba(15,23,42,0.05);
    --muted:#64748b;--muted2:#94a3b8;
    --green:#16a34a;--green-bg:rgba(22,163,74,0.06);
    --red:#dc2626;--red-bg:rgba(220,38,38,0.06);
    --blue-bg:rgba(37,99,235,0.06);
    --mono:Arial,sans-serif;
    --sans:'DM Sans',system-ui,sans-serif;
}

/* ── LAYOUT ── */
html,body{height:100%;overflow:hidden;}
body{display:flex;width:100vw;height:100vh;background:var(--bg-main);font-family:var(--sans);}
#sidebar-container{flex-shrink:0;}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

header{
  height:58px;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0;position:relative;z-index:100;
}
.header-title{font-size:0.95rem;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:8px;}
.header-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
#clock{
  font-family:var(--mono);font-size:11px;color:var(--muted2);
  background:var(--cream2);border:1px solid var(--border);
  border-radius:8px;padding:6px 14px;font-weight:500;
}

/* ── CONTENT ── */
.content{padding:20px 24px 28px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--cream3) transparent;}
.content::-webkit-scrollbar{width:4px;}.content::-webkit-scrollbar-thumb{background:var(--cream3);border-radius:10px;}

/* ── STATS RIBBON ── */
.stats-ribbon{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;}
.stat-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;
  box-shadow:var(--shadow-lux);position:relative;overflow:hidden;
  transition:box-shadow 0.3s;
}
.stat-card:hover{box-shadow:var(--shadow-hover);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card:nth-child(1)::before{background:var(--accent);}
.stat-card:nth-child(2)::before{background:var(--success);}
.stat-card:nth-child(3)::before{background:var(--ink3);}
.stat-card:nth-child(4)::before{background:var(--warning);}
.stat-card:nth-child(5)::before{background:var(--error);}
.stat-label{
  display:block;font-size:0.58rem;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--text-muted2);margin-bottom:8px;
}
.stat-val{font-family:var(--mono);font-size:1.2rem;font-weight:700;color:var(--primary);letter-spacing:-0.5px;}

/* ── MAIN GRID ── */
.accounts-grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;}

/* ── FORM CARD ── */
.form-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:22px;box-shadow:var(--shadow-lux);
  position:sticky;top:0;transition:box-shadow 0.3s;
}
.form-card:hover{box-shadow:var(--shadow-hover);}
.form-card-title{
  display:flex;align-items:center;gap:10px;
  font-size:0.78rem;font-weight:700;color:var(--primary);margin-bottom:18px;
}
.form-card-icon{
  width:26px;height:26px;border-radius:8px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;
}
.form-group{margin-bottom:12px;}
.form-group label{
  display:block;font-size:0.58rem;font-weight:700;
  letter-spacing:0.8px;text-transform:uppercase;
  color:var(--text-muted2);margin-bottom:5px;
}
input[type="text"],input[type="number"]{
  width:100%;height:38px;padding:0 12px;
  border:1px solid var(--border);border-radius:8px;
  font-size:0.8rem;font-weight:600;outline:none;
  background:var(--bg-main);color:var(--ink);font-family:var(--mono);
  transition:all 0.2s;
}
input:focus{border-color:var(--accent);background:var(--white);box-shadow:0 0 0 3px rgba(37,99,235,0.08);}
input[readonly]{background:var(--cream2);color:var(--text-muted2);cursor:default;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-primary{
  width:100%;height:40px;background:var(--accent);color:#fff;
  border:none;border-radius:8px;font-family:inherit;
  font-weight:700;font-size:0.78rem;cursor:pointer;
  transition:all 0.2s;margin-top:14px;letter-spacing:0.3px;
}
.btn-primary:hover{background:var(--accent3);transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,99,235,0.3);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ── TABLE CARD ── */
.table-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lux);
}
.table-header{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.table-title{font-size:0.82rem;font-weight:700;color:var(--primary);}
.table-count{
  font-family:var(--mono);font-size:0.62rem;color:var(--accent);
  background:var(--blue-bg);border:1px solid var(--blue-ln);
  border-radius:8px;padding:4px 12px;font-weight:600;
}
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;background:var(--cream2);
  padding:11px 16px;font-size:0.58rem;font-weight:700;
  color:var(--text-muted2);text-transform:uppercase;
  letter-spacing:0.8px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{
  padding:12px 16px;font-size:0.8rem;font-weight:500;
  border-bottom:1px solid var(--rule2);color:var(--ink);
  vertical-align:middle;
}
tr:last-child td{border-bottom:none;}
tr.row{cursor:pointer;transition:background 0.15s;}
tr.row:hover td{background:var(--accent-light)!important;}

.client-cell{display:flex;align-items:center;gap:11px;}
.c-avatar{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;font-weight:800;letter-spacing:0.3px;
}
.c-name{font-weight:700;font-size:0.82rem;color:var(--primary);}
.c-uid{font-size:0.62rem;color:var(--text-muted2);font-family:var(--mono);margin-top:1px;}

.pill{
  display:inline-flex;align-items:center;
  padding:3px 10px;border-radius:6px;
  font-size:0.68rem;font-weight:700;font-family:var(--mono);
  border:1px solid transparent;
}
.pill-gold{background:var(--blue-bg);color:var(--accent);border-color:var(--blue-ln);}
.pill-green{background:var(--green-bg);color:var(--green);border-color:var(--green-ln);}
.pill-red{background:var(--red-bg);color:var(--red);border-color:rgba(220,38,38,0.15);}

.action-btns{display:flex;gap:5px;justify-content:flex-end;}
.btn-icon{
  width:30px;height:30px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;
  border:1px solid var(--border);background:var(--white);color:var(--text-muted);
}
.btn-icon:hover.edit{background:var(--accent-light);color:var(--accent);border-color:var(--blue-ln);box-shadow:0 2px 8px rgba(37,99,235,0.1);}
.btn-icon:hover.del{background:var(--red-bg);color:var(--red);border-color:rgba(220,38,38,0.15);}

.empty-state{text-align:center;padding:48px 20px;font-size:0.82rem;color:var(--text-muted2);}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(15,23,42,0.4);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:500;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--white);width:380px;
  padding:28px;border-radius:14px;
  box-shadow:0 20px 60px rgba(15,23,42,0.2);
  border:1px solid var(--border);
  animation:modal-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modal-in{
  from{transform:scale(0.94) translateY(10px);opacity:0;}
  to{transform:scale(1) translateY(0);opacity:1;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-head h3{font-size:1rem;font-weight:800;color:var(--primary);}
.btn-modal-close{
  width:30px;height:30px;border-radius:8px;
  border:1px solid var(--border);background:var(--white);
  color:var(--text-muted);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.btn-modal-close:hover{background:var(--red-bg);color:var(--red);border-color:rgba(220,38,38,0.15);}
</style>
</head>
<body>

<script src="sidebar.js?v=2"></script>
<div id="sidebar-container"></div>

<main>
  <header>
    <div class="header-title">Party Terminal</div>
    <div id="clock">--</div>
  </header>

  <div class="content">

    <!-- Stats -->
    <div class="stats-ribbon">
      <div class="stat-card">
        <span class="stat-label">Total Registered</span>
        <span class="stat-val" id="stat-clients">0 Clients</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Global Metal Debt</span>
        <span class="stat-val" id="stat-metal">0.000 g</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Gold Rate</span>
        <span class="stat-val" id="stat-rate">Rs. 0.00 / 10g</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Metal Value</span>
        <span class="stat-val" id="stat-metalval">Rs. 0.00</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Global Cash Debt</span>
        <span class="stat-val" id="stat-cash">Rs. 0.00</span>
      </div>
    </div>

    <!-- Main grid -->
    <div class="accounts-grid">

      <!-- New Registration Form -->
      <div class="form-card">
        <div class="form-card-title">
          <div class="form-card-icon">+</div>
          New Registration
        </div>
        <div class="form-group">
          <label>Client Full Name</label>
          <input type="text" id="c-name" placeholder="e.g. Rajesh Bhai Zaveri" data-next="c-phone">
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" id="c-phone" placeholder="+91 00000 00000" data-next="c-metal">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Metal Limit (g)</label>
            <input type="number" id="c-metal" placeholder="0.000" data-next="c-cash">
          </div>
          <div class="form-group">
            <label>Cash Limit</label>
            <input type="number" id="c-cash" placeholder="0.00" data-next="btn-authorize">
          </div>
        </div>
        <button class="btn-primary" id="btn-authorize" onclick="saveClient()">Authorize Account</button>
      </div>

      <!-- Client Table -->
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">Registered Clients</span>
          <span class="table-count" id="client-count">0 clients</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Client Identity</th>
              <th>Contact</th>
              <th>Metal Live</th>
              <th>Cash Live</th>
              <th style="text-align:right;">Action</th>
            </tr>
          </thead>
          <tbody id="client-tbody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</main>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Edit Limits</h3>
      <button class="btn-modal-close" onclick="closeModal()">&times;</button>
    </div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Client Name</label>
      <input type="text" id="edit-name" readonly>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Metal Limit (g)</label>
        <input type="number" id="edit-metal" placeholder="0.000">
      </div>
      <div class="form-group">
        <label>Cash Limit</label>
        <input type="number" id="edit-cash" placeholder="0.00">
      </div>
    </div>
    <button class="btn-primary" id="btn-update" onclick="updateLimits()">Save Changes</button>
  </div>
</div>

<script>
function updateClock(){
  var n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('en-GB') + ' | ' + n.toLocaleTimeString();
}
setInterval(updateClock, 1000); updateClock();

var clientList = [];
var GOLD_RATE = parseFloat(localStorage.getItem('aurum_gold_rate') || 0);
function toMoney(g){ return (parseFloat(g||0) * GOLD_RATE / 10.0); }
function initials(n){ return (n||'').split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().substring(0,2)||'??'; }

async function loadGoldRate(){
  try {
    var cached = parseFloat(localStorage.getItem('aurum_gold_rate') || 0);
    if (cached > 0) { GOLD_RATE = cached; }
    else if (window.pywebview && window.pywebview.api && window.pywebview.api.get_settings) {
      var s = await window.pywebview.api.get_settings();
      var r = (s && (s.gold_rate != null ? s.gold_rate : (s.data && s.data.gold_rate))) || 0;
      GOLD_RATE = parseFloat(r) || 0;
      try { localStorage.setItem('aurum_gold_rate', GOLD_RATE); } catch(e){}
    }
  } catch(e) {}
  var el = document.getElementById('stat-rate');
  if (el) el.textContent = 'Rs. ' + (GOLD_RATE||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' / 10g';
}

async function loadClients(){
  if(!window.pywebview?.api) return;
  await loadGoldRate();
  var clients = await window.pywebview.api.get_client_list();
  clientList = clients;
  var tbody = document.getElementById('client-tbody');
  document.getElementById('client-count').textContent = clients.length + ' client' + (clients.length===1?'':'s');
  document.getElementById('stat-clients').textContent = clients.length + ' Client' + (clients.length===1?'':'s');
  tbody.innerHTML = '';
  if(!clients.length){
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No clients registered yet.</td></tr>';
    return;
  }
  var gMetal=0, gCash=0;
  for(var i=0;i<clients.length;i++){
    (function(c,idx){
      window.pywebview.api.get_client_balances(c.name).then(function(bal){
        gMetal += bal.metal; gCash += bal.cash;
        var mOver = bal.metal > (parseFloat(c.metal_limit)||0) && (parseFloat(c.metal_limit)||0)>0;
        var cOver = bal.cash  > (parseFloat(c.cash_limit) ||0) && (parseFloat(c.cash_limit) ||0)>0;
        var tr = document.createElement('tr');
        tr.className = 'row';
        tr.ondblclick = function(){ window.location.href='client_ledger.html?name='+encodeURIComponent(c.name); };
        var mVal = toMoney(bal.metal);
        tr.innerHTML =
          '<td><div class="client-cell">'
          +'<div class="c-avatar">'+initials(c.name)+'</div>'
          +'<div><div class="c-name">'+c.name+'</div>'
          +'<div class="c-uid">CL-'+String(idx+1).padStart(3,'0')+'</div></div>'
          +'</div></td>'
          +'<td style="font-family:var(--mono);font-size:0.72rem;color:var(--text-muted);">'+(c.phone||'---')+'</td>'
          +'<td><span class="pill '+(mOver?'pill-red':'pill-gold')+'">'+parseFloat(bal.metal).toFixed(3)+' g</span>'
          +'<div style="font-family:var(--mono);font-size:0.62rem;color:var(--text-muted2);margin-top:3px;">Rs. '+mVal.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div></td>'
          +'<td><span class="pill '+(cOver?'pill-red':'pill-green')+'">Rs. '+parseFloat(bal.cash).toLocaleString('en-IN')+'</span></td>'
          +'<td style="text-align:right;"><div class="action-btns">'
          +'<button class="btn-icon edit" title="Edit limits" onclick="event.stopPropagation();openEdit('+c.id+')">'
          +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg>'
          +'</button>'
          +'<button class="btn-icon del" title="Remove client" onclick="event.stopPropagation();removeClient('+c.id+')">'
          +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>'
          +'</button>'
          +'</div></td>';
        tbody.appendChild(tr);
        document.getElementById('stat-metal').textContent = gMetal.toFixed(3)+' g';
        var mEl = document.getElementById('stat-metalval');
        if (mEl) mEl.textContent = 'Rs. '+toMoney(gMetal).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
        document.getElementById('stat-cash').textContent  = 'Rs. '+gCash.toLocaleString('en-IN');
      });
    })(clients[i], i);
  }
}

function openEdit(id){
  var c = clientList.find(function(x){return x.id===id;});
  if(!c) return;
  document.getElementById('edit-id').value    = c.id;
  document.getElementById('edit-name').value  = c.name;
  document.getElementById('edit-metal').value = c.metal_limit;
  document.getElementById('edit-cash').value  = c.cash_limit;
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal(){ document.getElementById('edit-modal').classList.remove('open'); }

async function updateLimits(){
  if(!window.pywebview?.api) return;
  var btn = document.getElementById('btn-update');
  btn.disabled=true; btn.textContent='Saving...';
  try{
    var res = await window.pywebview.api.update_client_limits({
      id: Number(document.getElementById('edit-id').value),
      metal_limit: parseFloat(document.getElementById('edit-metal').value)||0,
      cash_limit:  parseFloat(document.getElementById('edit-cash').value)||0
    });
    if(res&&res.status==='success'){ closeModal(); loadClients(); }
    else alert('Failed: '+(res?.message||'Unknown error'));
  }catch(e){ alert('Error: '+e); }
  finally{ btn.disabled=false; btn.textContent='Save Changes'; }
}

async function saveClient(){
  var name = document.getElementById('c-name').value.trim();
  if(!name){ document.getElementById('c-name').focus(); return; }
  var btn = document.getElementById('btn-authorize');
  btn.disabled=true; btn.textContent='Saving...';
  try{
    var res = await window.pywebview.api.add_new_client({
      name: name,
      phone: document.getElementById('c-phone').value,
      metal_limit: parseFloat(document.getElementById('c-metal').value)||0,
      cash_limit:  parseFloat(document.getElementById('c-cash').value)||0
    });
    if(res.status==='success'){
      ['c-name','c-phone','c-metal','c-cash'].forEach(function(id){document.getElementById(id).value='';});
      document.getElementById('c-name').focus();
      loadClients();
    } else alert('Failed: '+(res.message||'Unknown error'));
  }catch(e){ alert('Error: '+e); }
  finally{ btn.disabled=false; btn.textContent='Authorize Account'; }
}

async function removeClient(id){
  if(!await aurumConfirm('Remove this client and all their data?',{title:'Delete Client',confirmText:'Delete',type:'danger'})) return;
  var res = await window.pywebview.api.delete_master_entry('client', id);
  if(res.status==='success') loadClients();
}

document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  var el = document.activeElement, nid = el.dataset.next;
  if(!nid) return;
  e.preventDefault();
  var next = document.getElementById(nid);
  if(next) next.tagName==='BUTTON' ? next.click() : next.focus();
});

document.getElementById('edit-modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

window.addEventListener('load', function(){
  initSidebar('party');
  var t = setInterval(function(){
    if(!window.pywebview?.api) return;
    clearInterval(t);
    loadClients();
  }, 100);
});
</script>
