<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AurumOS | Staff</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--cream:#faf8f3;--ink:#0e0c09;--rule:rgba(14,12,9,0.09);--gold2:#c9a227;--gold3:#8a6c0a;--muted2:#9e9890;--serif:'DM Serif Display',Georgia,serif;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);}
main{width:100%;display:flex;flex-direction:column;overflow:hidden;}
header{height:58px;background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 24px;flex-shrink:0;position:relative;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(168,125,30,0.2) 50%,transparent 95%);}
.h-title{font-family:var(--serif);font-size:1rem;color:var(--ink);}
.h-title em{color:var(--gold3);font-style:italic;}
.content{padding:40px;display:flex;align-items:center;justify-content:center;flex:1;}
.placeholder{text-align:center;color:var(--muted2);}
.placeholder h2{font-family:var(--serif);font-size:1.5rem;color:var(--ink);margin-bottom:8px;}
.placeholder p{font-size:0.8rem;}
</style>
<style id="aurum-layout-fix">
body { display: flex !important; height: 100vh !important; overflow: hidden !important; width: 100vw !important; }
#sidebar-container { flex-shrink: 0 !important; width: 252px !important; }
body > main { flex: 1 !important; min-width: 0 !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; }
body.sidebar-collapsed #sidebar-container { width: 66px !important; }
</style>
</head>
<body>
<script src="sidebar.js"></script>
<div id="sidebar-container"></div>

<main>
<header><div class="h-title">Staff <em>Management</em></div></header>
<div class="content">
  <div class="placeholder">
    <h2>Staff Module</h2>
    <p>Coming soon — staff management features will appear here.</p>
  </div>
</div>
</main>
<script>
waitForAPI(function(){ initSidebar('staff'); });
</script>
</body>
</html>
